<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dodge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 10px; }
canvas { border: 2px solid #444; cursor: none; }
#ui { display: flex; gap: 16px; align-items: center; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 8px 18px; cursor: pointer; font: inherit; border-radius: 4px; }
a { color: #666; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">Move mouse to dodge</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const W = canvas.width, H = canvas.height;
let state = 'idle', player, obstacles, score, speed, raf, mx = W/2, my = H-50;

canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });

function init() {
  player = { x: W/2, y: H-50, r: 14 };
  obstacles = []; score = 0; speed = 3;
  state = 'playing';
  btn.textContent = 'Restart';
  cancelAnimationFrame(raf);
  loop();
}

function spawnObs() {
  const w = 20 + Math.random() * 60, h = 14 + Math.random() * 20;
  obstacles.push({ x: Math.random() * (W - w), y: -h, w, h, vy: speed + Math.random() * 2 });
}

function update() {
  player.x += (mx - player.x) * 0.25;
  player.y += (my - player.y) * 0.25;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));
  if (Math.random() < 0.04 + score * 0.0002) spawnObs();
  for (const o of obstacles) {
    o.y += o.vy;
    if (player.x + player.r > o.x && player.x - player.r < o.x + o.w &&
        player.y + player.r > o.y && player.y - player.r < o.y + o.h) { endGame(); return; }
  }
  obstacles = obstacles.filter(o => o.y < H + 30);
  score++;
  speed = 3 + score / 300;
  msg.textContent = 'Score: ' + score + (score > 500 ? ' 🔥' : '');
}

function draw() {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e74c3c';
  for (const o of obstacles) ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  ctx.fillStyle = '#3498db'; ctx.fill();
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r - 6, 0, Math.PI*2);
  ctx.fillStyle = '#5dade2'; ctx.fill();
  if (state === 'idle') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
    ctx.fillText('DODGE', W/2, H/2-20);
    ctx.font = '14px monospace'; ctx.fillText('Move mouse to survive', W/2, H/2+14);
    ctx.textAlign = 'left';
  }
}

function endGame() {
  state = 'over';
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
  ctx.fillText('HIT!', W/2, H/2-20);
  ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
  ctx.fillText('Score: ' + score, W/2, H/2+16);
  ctx.textAlign = 'left';
  msg.textContent = 'Survived ' + score + ' frames!';
}

function loop() { update(); draw(); if (state === 'playing') raf = requestAnimationFrame(loop); }
btn.addEventListener('click', init);
document.addEventListener('keydown', e => { if (e.code === 'Space' && (state==='idle'||state==='over')) init(); });
draw();
</script>
</body>
</html>
