<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Turret Defense</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #333; cursor: pointer; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; flex-wrap: wrap; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">Click grid to place turrets ($10 each)</span>
  <button id="btn">Start Wave</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=480,CS=40,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const COLS=W/CS,ROWS=H/CS;
// Path: left edge to right edge
const PATH=[[0,6],[1,6],[2,6],[3,6],[3,5],[3,4],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[9,4],[9,5],[9,6],[9,7],[9,8],[8,8],[7,8],[6,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]].map(([c,r])=>({c,r}));
// Actually let's define path as walkable pixel positions
const PATH_CELLS=new Set(PATH.map(p=>`${p.c},${p.r}`));

let turrets=[],enemies=[],bullets=[],wave=0,lives=20,gold=50,state='build',raf,spawnQueue=[],spawnTimer=0;

function init(){
  turrets=[];enemies=[];bullets=[];wave=0;lives=20;gold=50;state='build';
  btn.textContent='Start Wave';updateMsg();cancelAnimationFrame(raf);draw();
}

function updateMsg(){msg.textContent=`Wave:${wave} Lives:${lives} Gold:$${gold} | Click grid to place turret ($10)`;}

canvas.addEventListener('click',e=>{
  if(state!=='build')return;
  const r=canvas.getBoundingClientRect();
  const cc=Math.floor((e.clientX-r.left)/CS),rc=Math.floor((e.clientY-r.top)/CS);
  if(PATH_CELLS.has(`${cc},${rc}`))return;
  if(turrets.some(t=>t.c===cc&&t.r===rc))return;
  if(gold<10)return;
  gold-=10;turrets.push({c:cc,r:rc,x:cc*CS+CS/2,y:rc*CS+CS/2,range:100,cooldown:0,damage:1});
  updateMsg();draw();
});

btn.addEventListener('click',()=>{
  if(state==='build'){state='wave';wave++;spawnQueue=[];
    const n=5+wave*3;for(let i=0;i<n;i++)spawnQueue.push({delay:i*40,hp:1+Math.floor(wave/3),maxHp:1+Math.floor(wave/3),speed:0.8+wave*0.05});
    cancelAnimationFrame(raf);loop();
  }
});

function spawnEnemy(cfg){
  const start=PATH[0];
  enemies.push({x:start.c*CS+CS/2,y:start.r*CS+CS/2,hp:cfg.hp,maxHp:cfg.maxHp,speed:cfg.speed,pathIdx:0,t:0});
}

function update(){
  spawnTimer++;
  spawnQueue=spawnQueue.filter(s=>{if(s.delay<=0){spawnEnemy(s);return false;}s.delay--;return true;});

  // move enemies along path
  enemies.forEach(e=>{
    if(e.pathIdx>=PATH.length-1){lives--;e.pathIdx=9999;return;}
    const target=PATH[e.pathIdx+1];
    const tx=target.c*CS+CS/2,ty=target.r*CS+CS/2;
    const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
    if(d<e.speed){e.x=tx;e.y=ty;e.pathIdx++;}
    else{e.x+=dx/d*e.speed;e.y+=dy/d*e.speed;}
  });
  enemies=enemies.filter(e=>e.pathIdx<PATH.length-1);
  if(lives<=0){endGame();return;}

  // turret shoot
  turrets.forEach(t=>{
    if(t.cooldown>0){t.cooldown--;return;}
    const target=enemies.find(e=>Math.hypot(e.x-t.x,e.y-t.y)<t.range);
    if(!target)return;
    bullets.push({x:t.x,y:t.y,tx:target,speed:6,r:4,dmg:t.damage});
    t.cooldown=30;
  });

  // move bullets
  bullets.forEach(b=>{
    if(!enemies.includes(b.tx)){b.hit=true;return;}
    const dx=b.tx.x-b.x,dy=b.tx.y-b.y,d=Math.hypot(dx,dy);
    if(d<b.speed){b.tx.hp-=b.dmg;b.hit=true;if(b.tx.hp<=0){enemies=enemies.filter(e=>e!==b.tx);gold+=5;updateMsg();}}
    else{b.x+=dx/d*b.speed;b.y+=dy/d*b.speed;}
  });
  bullets=bullets.filter(b=>!b.hit);

  if(!spawnQueue.length&&!enemies.length){state='build';btn.textContent='Start Wave';gold+=20+wave*5;updateMsg();}
  if(state==='wave')updateMsg();
}

function draw(){
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#222';ctx.lineWidth=1;
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)ctx.strokeRect(c*CS,r*CS,CS,CS);
  // path
  PATH.forEach(p=>{ctx.fillStyle='#2a1800';ctx.fillRect(p.c*CS,p.r*CS,CS,CS);});
  ctx.strokeStyle='#5a3800';ctx.lineWidth=2;
  ctx.beginPath();PATH.forEach((p,i)=>{i?ctx.lineTo(p.c*CS+CS/2,p.r*CS+CS/2):ctx.moveTo(p.c*CS+CS/2,p.r*CS+CS/2);});ctx.stroke();
  // start/end markers
  ctx.fillStyle='#0f0';ctx.font='10px monospace';ctx.fillText('IN',PATH[0].c*CS+4,PATH[0].r*CS+24);
  ctx.fillStyle='#f00';ctx.fillText('OUT',PATH[PATH.length-1].c*CS+2,PATH[PATH.length-1].r*CS+24);
  // turrets
  turrets.forEach(t=>{
    ctx.fillStyle='#558';ctx.fillRect(t.c*CS+4,t.r*CS+4,CS-8,CS-8);
    ctx.fillStyle='#88c';ctx.fillRect(t.c*CS+CS/2-3,t.r*CS+4,6,CS/2);
  });
  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle=`hsl(${(1-e.hp/e.maxHp)*120},100%,45%)`;
    ctx.beginPath();ctx.arc(e.x,e.y,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#300';ctx.fillRect(e.x-9,e.y-14,18,4);
    ctx.fillStyle='#0a0';ctx.fillRect(e.x-9,e.y-14,18*(e.hp/e.maxHp),4);
  });
  // bullets
  ctx.fillStyle='#ff0';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
  // HUD
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,24);
  ctx.fillStyle='#fff';ctx.font='12px monospace';
  ctx.fillText(`Wave:${wave}  Lives:${lives}  Gold:$${gold}  Turrets:${turrets.length}`,6,16);
}

function endGame(){
  state='over';cancelAnimationFrame(raf);draw();
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f00';ctx.font='bold 24px monospace';ctx.textAlign='center';
  ctx.fillText('BASE DESTROYED!',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='16px monospace';
  ctx.fillText('Wave '+wave,W/2,H/2+16);ctx.textAlign='left';
  msg.textContent='💀 Reached wave '+wave;
  btn.textContent='Restart';btn.onclick=()=>{btn.onclick=null;init();};
}

function loop(){update();draw();if(state==='wave'||enemies.length)raf=requestAnimationFrame(loop);}
init();
</script>
</body>
</html>
