<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prestige Counter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a1a; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 14px; }
#counter { font-size: 3rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px #ffd700; }
#prestige-level { font-size: 1rem; color: #aaa; }
#btn-click { font-size: 1.4rem; padding: 18px 40px; background: #2a2a4a; color: #fff;
             border: 2px solid #4a4a8a; cursor: pointer; border-radius: 8px; font: inherit;
             transition: background 0.1s; }
#btn-click:hover { background: #3a3a6a; }
#upgrades { display: flex; flex-direction: column; gap: 6px; width: 380px; }
.upg { background: #1a1a3a; border: 1px solid #3a3a6a; border-radius: 6px; padding: 8px 12px;
       display: flex; justify-content: space-between; align-items: center; }
.upg button { background: #4a4a8a; color: #fff; border: none; padding: 4px 10px;
              cursor: pointer; font: inherit; border-radius: 3px; font-size: 0.8rem; }
.upg button:disabled { background: #333; color: #666; cursor: default; }
#prestige-btn { padding: 10px 28px; background: #8a2a8a; color: #fff; border: 2px solid #aa4aaa;
                cursor: pointer; font: inherit; border-radius: 6px; font-size: 0.95rem; display: none; }
#prestige-btn:hover { background: #aa4aaa; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<div id="prestige-level">Prestige: ⭐×0</div>
<div id="counter">0</div>
<button id="btn-click">Click! (+1)</button>
<div id="upgrades"></div>
<button id="prestige-btn">✨ Prestige (reset for ×bonus)</button>
<div id="ui">
  <span id="msg">Click to count · buy upgrades · prestige for multiplier!</span>
  <a href="../index.html">↩</a>
</div>
<script>
const UPGRADES=[
  {name:'Double Click',desc:'+1 per click',cost:10,owned:0,clickBonus:1,cps:0},
  {name:'Auto Clicker',desc:'+1/sec',cost:25,owned:0,clickBonus:0,cps:1},
  {name:'Turbo Click',desc:'+5 per click',cost:100,owned:0,clickBonus:5,cps:0},
  {name:'Batch Process',desc:'+10/sec',cost:250,owned:0,clickBonus:0,cps:10},
  {name:'Mega Click',desc:'+25 per click',cost:500,owned:0,clickBonus:25,cps:0},
  {name:'Super Auto',desc:'+50/sec',cost:1000,owned:0,clickBonus:0,cps:50},
];
let count=0,prestige=0,lastTick=Date.now();

function mult(){return 1+prestige*0.5;}
function clickPower(){return Math.floor((1+UPGRADES.reduce((s,u)=>s+u.clickBonus*u.owned,0))*mult());}
function cps(){return Math.floor(UPGRADES.reduce((s,u)=>s+u.cps*u.owned,0)*mult());}
function prestigeThreshold(){return 10000*Math.pow(5,prestige);}

function tick(){
  const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;
  count+=cps()*dt;render();requestAnimationFrame(tick);
}

function fmt(n){
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}

function render(){
  document.getElementById('counter').textContent=fmt(count);
  document.getElementById('prestige-level').textContent=`Prestige: ⭐×${prestige}  Multiplier: ×${mult().toFixed(1)}`;
  document.getElementById('btn-click').textContent=`Click! (+${fmt(clickPower())})`;
  const pBtn=document.getElementById('prestige-btn');
  const thresh=prestigeThreshold();
  if(count>=thresh){pBtn.style.display='block';pBtn.textContent=`✨ Prestige at ${fmt(thresh)} (×${(mult()+0.5).toFixed(1)} bonus)`;}
  else pBtn.style.display='none';
  const div=document.getElementById('upgrades');div.innerHTML='';
  UPGRADES.forEach((u,i)=>{
    const c=Math.floor(u.cost*Math.pow(1.5,u.owned));
    const d=document.createElement('div');d.className='upg';
    d.innerHTML=`<div><b>${u.name}</b> (${u.owned}) <span style="color:#aaa;font-size:0.8rem">${u.desc}</span></div>`;
    const b=document.createElement('button');b.textContent=`${fmt(c)}`;
    b.disabled=count<c;b.onclick=()=>{if(count>=c){count-=c;u.owned++;render();}};
    d.appendChild(b);div.appendChild(d);
  });
}

document.getElementById('btn-click').onclick=()=>{count+=clickPower();render();};
document.getElementById('prestige-btn').onclick=()=>{
  prestige++;count=0;UPGRADES.forEach(u=>u.owned=0);render();
};
render();requestAnimationFrame(tick);
</script>
</body>
</html>
