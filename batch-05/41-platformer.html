<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Platformer Basic</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #333; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="400"></canvas>
<div id="ui">
  <span id="msg">← → move · Space/↑ jump · Reach the flag!</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=400,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const G=0.5,JUMP=-11,SPD=3.5;
let state='idle',p,platforms,flag,enemies,coins,score,level,raf,keys={},camX=0;

function mkLevel(n){
  const pls=[{x:-100,y:H-30,w:700,h:30}]; // ground
  const extras=[[150,280,100,14],[300,220,90,14],[420,160,100,14],[550,200,80,14],[680,150,100,14],[800,100,120,14],[900,180,80,14],[1000,120,100,14]];
  extras.forEach(([x,y,w,h])=>pls.push({x,y,w,h}));
  const f={x:1080,y:60};
  const en=[{x:300,y:260,vx:1,w:24,h:24,dir:1},{x:700,y:130,vx:1.5,w:24,h:24,dir:1}];
  const co=[];
  extras.forEach(pl=>co.push({x:pl.x+pl.w/2,y:pl.y-20,r:8,alive:true}));
  return{platforms:pls,flag:f,enemies:en,coins:co};
}

function init(){
  level=1;score=0;
  const lv=mkLevel(level);
  platforms=lv.platforms;flag=lv.flag;enemies=lv.enemies;coins=lv.coins;
  p={x:50,y:H-80,w:24,h:32,vx:0,vy:0,onGround:false,jumps:0};
  camX=0;state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function collideH(px,py,pw,ph){
  return platforms.some(pl=>px+pw>pl.x&&px<pl.x+pl.w&&py+ph>pl.y&&py<pl.y+pl.h);
}

function update(){
  if(keys['ArrowLeft']||keys['KeyA'])p.vx=-SPD;
  else if(keys['ArrowRight']||keys['KeyD'])p.vx=SPD;
  else p.vx*=0.7;
  if((keys['Space']||keys['ArrowUp']||keys['KeyW'])&&p.jumps<2){p.vy=JUMP;p.jumps++;keys['Space']=keys['ArrowUp']=keys['KeyW']=false;}

  p.vy+=G;p.x+=p.vx;
  if(collideH(p.x,p.y,p.w,p.h)){p.x-=p.vx;p.vx=0;}
  p.y+=p.vy;p.onGround=false;
  if(collideH(p.x,p.y,p.w,p.h)){
    if(p.vy>0){p.y-=p.vy;while(collideH(p.x,p.y,p.w,p.h))p.y--;p.vy=0;p.onGround=true;p.jumps=0;}
    else{p.y-=p.vy;p.vy=0;}
  }
  if(p.y>H+50){endGame(false);return;}

  // enemies patrol
  enemies.forEach(e=>{
    e.x+=e.vx*e.dir;
    if(e.x<50||e.x>1050)e.dir*=-1;
    // kill player
    if(p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h){
      if(p.vy>0&&p.y+p.h<e.y+e.h/2){e.alive=false;p.vy=-8;score+=50;}
      else endGame(false);
    }
  });
  enemies=enemies.filter(e=>e.alive!==false);

  // coins
  coins.forEach(c=>{
    if(!c.alive)return;
    if(Math.hypot(p.x+p.w/2-c.x,p.y+p.h/2-c.y)<c.r+12){c.alive=false;score+=10;}
  });

  // flag
  if(p.x+p.w>flag.x&&p.x<flag.x+20&&p.y+p.h>flag.y&&p.y<flag.y+60){endGame(true);return;}

  camX+=(p.x-camX-200)*0.1;
  camX=Math.max(0,camX);
  msg.textContent=`Score:${score}  Coins:${coins.filter(c=>c.alive).length} left`;
}

function draw(){
  ctx.fillStyle='#1a2a3a';ctx.fillRect(0,0,W,H);
  // bg hills
  ctx.fillStyle='#1e3a1e';[[-camX*0.3+0,H-80,200,80],[-camX*0.3+220,H-100,180,100],[-camX*0.3+450,H-70,200,70]].forEach(([x,y,w,h])=>ctx.fillRect(x%W,y,w,h));
  ctx.save();ctx.translate(-camX,0);
  // platforms
  platforms.forEach(pl=>{
    ctx.fillStyle='#3a5a2a';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle='#4a7a3a';ctx.fillRect(pl.x,pl.y,pl.w,8);
  });
  // flag
  ctx.fillStyle='#aaa';ctx.fillRect(flag.x,flag.y,4,60);
  ctx.fillStyle='#f00';ctx.fillRect(flag.x+4,flag.y,20,14);
  // coins
  coins.forEach(c=>{
    if(!c.alive)return;
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffaa00';ctx.fillText('$',c.x-5,c.y+4);
  });
  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle='#c00';ctx.fillRect(e.x,e.y,e.w,e.h);
    ctx.fillStyle='#f00';ctx.fillRect(e.x+3,e.y+3,8,8);ctx.fillRect(e.x+e.w-11,e.y+3,8,8);
  });
  // player
  ctx.fillStyle='#3af';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#fff';ctx.fillRect(p.x+4,p.y+6,6,6);ctx.fillRect(p.x+p.w-10,p.y+6,6,6);
  ctx.restore();
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';
    ctx.fillText('PLATFORMER',W/2,H/2-20);ctx.font='13px monospace';ctx.fillText('← → move  Space jump  Reach the 🚩',W/2,H/2+14);ctx.textAlign='left';
  }
}

function endGame(won){
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=won?'#2ecc71':'#e74c3c';ctx.font='bold 26px monospace';ctx.textAlign='center';
  ctx.fillText(won?'YOU WIN! 🎉':'GAME OVER',W/2,H/2-20);
  ctx.fillStyle='#fff';ctx.font='16px monospace';ctx.fillText('Score: '+score,W/2,H/2+16);ctx.textAlign='left';
  msg.textContent=(won?'🎉 ':'💀 ')+'Score: '+score;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&(state==='idle'||state==='over'))init();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
