<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME NAME</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column;
       align-items: center; justify-content: center; min-height: 100vh;
       font-family: monospace; color: #eee; }
canvas { border: 2px solid #444; display: block; }
#ui { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
button { background: #333; color: #eee; border: 1px solid #555;
         padding: 8px 18px; cursor: pointer; font: inherit; border-radius: 4px; }
button:hover { background: #444; }
#msg { font-size: 1.1rem; min-width: 200px; text-align: center; }
a { color: #888; font-size: 0.85rem; text-decoration: none; }
a:hover { color: #bbb; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">Press Start or Space</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩ Gallery</a>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

let state = 'idle'; // idle | playing | over
let score = 0;
let raf = null;

function init() {
  score = 0;
  state = 'playing';
  msg.textContent = 'Score: 0';
  btn.textContent = 'Restart';
  // TODO: reset game-specific state
  loop();
}

function loop() {
  update();
  draw();
  if (state === 'playing') raf = requestAnimationFrame(loop);
}

function update() {
  // TODO: game logic
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // TODO: draw game
}

function endGame(won) {
  state = 'over';
  msg.textContent = won ? '🎉 You Win! Score: ' + score : 'Game Over — Score: ' + score;
  btn.textContent = 'Restart';
  cancelAnimationFrame(raf);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && (state === 'idle' || state === 'over')) { init(); return; }
  // TODO: handle keys during play
});

btn.addEventListener('click', init);
draw();
</script>
</body>
</html>
