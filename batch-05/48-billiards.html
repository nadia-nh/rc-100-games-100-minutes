<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billiards Lite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a1a0a; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #5a3a1a; cursor: crosshair; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="500" height="320"></canvas>
<div id="ui">
  <span id="msg">Aim & click to shoot · Pocket all balls!</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=500,H=320,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const R=10,POCKET_R=14,FRICTION=0.985;
let state='idle',balls,score,shots,mouse={x:0,y:0},raf,moving=false;

const POCKETS=[{x:20,y:20},{x:W/2,y:12},{x:W-20,y:20},{x:20,y:H-20},{x:W/2,y:H-12},{x:W-20,y:H-20}];
const COLORS=['#fff','#f90','#00f','#f00','#800','#f0f','#f60','#900','#0a0','#0ff','#ff0','#0f0','#f08','#08f','#a50','#555'];

function mkBalls(){
  const bs=[{x:120,y:H/2,vx:0,vy:0,r:R,color:'#fff',num:0,alive:true}];
  const cx=340,cy=H/2,rows=[[0],[1,9],[2,10,3],[4,11,12,5],[6,13,14,15,7]];
  rows.forEach((row,ri)=>row.forEach((n,ci)=>{
    const ox=ri*R*1.85,oy=(ci-(row.length-1)/2)*R*2.05;
    bs.push({x:cx+ox,y:cy+oy,vx:0,vy:0,r:R,color:COLORS[n+1],num:n+1,alive:true});
  }));
  return bs;
}

function init(){
  balls=mkBalls();score=0;shots=0;moving=false;
  state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function shoot(mx,my){
  if(moving)return;
  const cue=balls[0];
  const dx=cue.x-mx,dy=cue.y-my;
  const d=Math.sqrt(dx*dx+dy*dy)||1;
  const power=Math.min(d/8,18);
  cue.vx=(dx/d)*power;cue.vy=(dy/d)*power;
  shots++;moving=true;
}

function update(){
  if(state!=='playing')return;
  let anyMoving=false;
  balls.forEach(b=>{
    if(!b.alive)return;
    b.x+=b.vx;b.y+=b.vy;b.vx*=FRICTION;b.vy*=FRICTION;
    if(Math.abs(b.vx)<0.05)b.vx=0;if(Math.abs(b.vy)<0.05)b.vy=0;
    if(b.vx||b.vy)anyMoving=true;
    // walls
    if(b.x-b.r<16){b.x=16+b.r;b.vx=Math.abs(b.vx)*0.8;}
    if(b.x+b.r>W-16){b.x=W-16-b.r;b.vx=-Math.abs(b.vx)*0.8;}
    if(b.y-b.r<16){b.y=16+b.r;b.vy=Math.abs(b.vy)*0.8;}
    if(b.y+b.r>H-16){b.y=H-16-b.r;b.vy=-Math.abs(b.vy)*0.8;}
    // pockets
    for(const p of POCKETS){
      if(Math.hypot(b.x-p.x,b.y-p.y)<POCKET_R){
        b.alive=false;
        if(b.num===0){b.x=120;b.y=H/2;b.vx=0;b.vy=0;b.alive=true;}
        else score+=10;
      }
    }
  });
  // ball-ball collisions
  for(let i=0;i<balls.length;i++){
    if(!balls[i].alive)continue;
    for(let j=i+1;j<balls.length;j++){
      if(!balls[j].alive)continue;
      const dx=balls[j].x-balls[i].x,dy=balls[j].y-balls[i].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<R*2&&dist>0){
        const nx=dx/dist,ny=dy/dist;
        const overlap=(R*2-dist)/2;
        balls[i].x-=nx*overlap;balls[i].y-=ny*overlap;
        balls[j].x+=nx*overlap;balls[j].y+=ny*overlap;
        const dvx=balls[i].vx-balls[j].vx,dvy=balls[i].vy-balls[j].vy;
        const dot=dvx*nx+dvy*ny;
        if(dot>0){balls[i].vx-=dot*nx;balls[i].vy-=dot*ny;balls[j].vx+=dot*nx;balls[j].vy+=dot*ny;}
      }
    }
  }
  moving=anyMoving;
  const left=balls.filter(b=>b.alive&&b.num>0).length;
  if(left===0){endGame(true);return;}
  msg.textContent=`Balls left: ${left}  Score: ${score}  Shots: ${shots}  ${moving?'':'(aim & click)'}`;
}

function draw(){
  // table
  ctx.fillStyle='#1a5a1a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5a3a1a';ctx.fillRect(0,0,W,16);ctx.fillRect(0,H-16,W,16);
  ctx.fillRect(0,0,16,H);ctx.fillRect(W-16,0,16,H);
  // pockets
  POCKETS.forEach(p=>{ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x,p.y,POCKET_R,0,Math.PI*2);ctx.fill();});
  // cue line
  if(!moving&&state==='playing'){
    const cue=balls[0];
    const dx=cue.x-mouse.x,dy=cue.y-mouse.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(cue.x+dx/d*80,cue.y+dy/d*80);ctx.stroke();
    ctx.setLineDash([]);
  }
  // balls
  balls.forEach(b=>{
    if(!b.alive)return;
    ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
    if(b.num>0){ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(b.num,b.x,b.y+3);}
    ctx.textAlign='left';
  });
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('BILLIARDS',W/2,H/2-16);ctx.font='13px monospace';
    ctx.fillText('Aim & click to shoot white ball',W/2,H/2+14);ctx.textAlign='left';
  }
}

function endGame(won){
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2ecc71';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText('CLEARED!',W/2,H/2-16);ctx.fillStyle='#fff';ctx.font='14px monospace';
  ctx.fillText(`Score: ${score}  Shots: ${shots}`,W/2,H/2+14);ctx.textAlign='left';
  msg.textContent=`Cleared in ${shots} shots! Score: ${score}`;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
canvas.addEventListener('click',e=>{if(state==='playing'&&!moving){const r=canvas.getBoundingClientRect();shoot(e.clientX-r.left,e.clientY-r.top);}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&(state==='idle'||state==='over')){e.preventDefault();init();}});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
