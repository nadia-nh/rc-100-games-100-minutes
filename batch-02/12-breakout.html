<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 10px; }
canvas { border: 2px solid #444; }
#ui { display: flex; gap: 16px; align-items: center; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 8px 18px; cursor: pointer; font: inherit; border-radius: 4px; }
a { color: #666; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">Press Start</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const W = canvas.width, H = canvas.height;
const ROWS = 5, COLS = 10, BW = 44, BH = 16, BPAD = 2;
const PADDLE_W = 80, PADDLE_H = 12, BALL_R = 8, BALL_SPEED = 5;
let state = 'idle', paddle, ball, bricks, score, lives, raf;
let mouseX = W / 2;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && (state === 'idle' || state === 'over')) init();
});

function makeBricks() {
  const b = [];
  const colors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db'];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      b.push({ x: c * (BW + BPAD) + 4, y: r * (BH + BPAD) + 40, alive: true, color: colors[r] });
  return b;
}

function init() {
  paddle = { x: W / 2 - PADDLE_W / 2, y: H - 30 };
  ball = { x: W / 2, y: H - 60, vx: (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED * 0.7, vy: -BALL_SPEED };
  bricks = makeBricks();
  score = 0; lives = 3;
  state = 'playing';
  msg.textContent = 'Score: 0  Lives: ❤️❤️❤️';
  btn.textContent = 'Restart';
  cancelAnimationFrame(raf);
  loop();
}

function update() {
  paddle.x = Math.max(0, Math.min(W - PADDLE_W, mouseX - PADDLE_W / 2));
  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
  if (ball.y + BALL_R > H) {
    lives--;
    const hearts = '❤️'.repeat(lives);
    if (lives <= 0) { endGame(false); return; }
    ball = { x: W / 2, y: H - 60, vx: (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED * 0.7, vy: -BALL_SPEED };
    msg.textContent = `Score: ${score}  Lives: ${hearts}`;
  }
  // paddle
  if (ball.y + BALL_R >= paddle.y && ball.y - BALL_R <= paddle.y + PADDLE_H &&
      ball.x > paddle.x && ball.x < paddle.x + PADDLE_W) {
    ball.vy = -Math.abs(ball.vy);
    ball.vx = ((ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2)) * BALL_SPEED;
  }
  // bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + BW &&
        ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + BH) {
      b.alive = false; score += 10;
      ball.vy = -ball.vy;
      msg.textContent = `Score: ${score}  Lives: ${'❤️'.repeat(lives)}`;
    }
  }
  if (bricks.every(b => !b.alive)) endGame(true);
}

function draw() {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, BW, BH);
  }
  ctx.fillStyle = '#eee'; ctx.fillRect(paddle.x, paddle.y, PADDLE_W, PADDLE_H);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = '#f1c40f'; ctx.fill();
  if (state === 'idle') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
    ctx.fillText('BREAKOUT', W/2, H/2 - 16);
    ctx.font = '15px monospace'; ctx.fillText('Move mouse · Press Start', W/2, H/2 + 16);
    ctx.textAlign = 'left';
  }
}

function endGame(won) {
  state = 'over';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = won ? '#2ecc71' : '#e74c3c';
  ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
  ctx.fillText(won ? 'YOU WIN!' : 'GAME OVER', W/2, H/2 - 16);
  ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
  ctx.fillText('Score: ' + score, W/2, H/2 + 16);
  ctx.textAlign = 'left';
  msg.textContent = (won ? '🎉 Win! ' : '💀 ') + 'Score: ' + score;
}

function loop() { update(); draw(); if (state === 'playing') raf = requestAnimationFrame(loop); }
btn.addEventListener('click', init);
draw();
</script>
</body>
</html>
