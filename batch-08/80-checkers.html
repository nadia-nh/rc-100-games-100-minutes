<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkers Lite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2a1a0a; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 10px; }
canvas { border: 3px solid #5a3a1a; cursor: pointer; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #5a3a1a; color: #eee; border: 1px solid #8a5a2a; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #5a3a1a; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<div id="ui">
  <span id="msg">Click a piece to select, then click destination</span>
  <button id="btn">New Game</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=400,H=400,T=50,msg=document.getElementById('msg'),btn=document.getElementById('btn');
// pieces: 0=empty, 1=red, 2=black, 3=red king, 4=black king
let board,sel,turn,state='idle';

function init(){
  board=Array(8).fill(null).map(()=>Array(8).fill(0));
  for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=2;
  for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=1;
  sel=null;turn=1;state='playing';btn.textContent='New Game';
  msg.textContent='Your turn (red) · Click a piece to select';draw();
}

function isRed(v){return v===1||v===3;}
function isBlack(v){return v===2||v===4;}
function isKing(v){return v===3||v===4;}
function owned(v){return turn===1?isRed(v):isBlack(v);}
function enemy(v){return turn===1?isBlack(v):isRed(v);}

function getMoves(r,c){
  const p=board[r][c];if(!p||!owned(p))return[];
  const moves=[];
  const dirs=[];
  if(isRed(p)||isKing(p))dirs.push([-1,-1],[-1,1]);
  if(isBlack(p)||isKing(p))dirs.push([1,-1],[1,1]);
  for(const[dr,dc]of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=8||nc<0||nc>=8)continue;
    if(!board[nr][nc])moves.push({r:nr,c:nc,jump:false});
    else if(enemy(board[nr][nc])){
      const jr=r+dr*2,jc=c+dc*2;
      if(jr>=0&&jr<8&&jc>=0&&jc<8&&!board[jr][jc])moves.push({r:jr,c:jc,jump:true,mr:nr,mc:nc});
    }
  }
  return moves;
}

function allJumps(){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(owned(board[r][c])&&getMoves(r,c).some(m=>m.jump))return true;
  }return false;
}

function click(r,c){
  if(state!=='playing'||turn!==1)return;
  if(sel){
    const moves=getMoves(sel.r,sel.c).filter(m=>!allJumps()||m.jump);
    const mv=moves.find(m=>m.r===r&&m.c===c);
    if(mv){doMove(sel.r,sel.c,mv);return;}
    if(owned(board[r][c])){sel={r,c};draw();return;}
    sel=null;draw();return;
  }
  if(owned(board[r][c])){
    const moves=getMoves(r,c).filter(m=>!allJumps()||m.jump);
    if(moves.length){sel={r,c};draw();}
    else msg.textContent='That piece has no moves!';
  }
}

function doMove(fr,fc,mv){
  const piece=board[fr][fc];board[fr][fc]=0;
  if(mv.jump){board[mv.mr][mv.mc]=0;}
  board[mv.r][mv.c]=piece;
  // promote
  if(piece===1&&mv.r===0)board[mv.r][mv.c]=3;
  if(piece===2&&mv.r===7)board[mv.r][mv.c]=4;
  sel=null;
  if(mv.jump){
    const chainJumps=getMoves(mv.r,mv.c).filter(m=>m.jump);
    if(chainJumps.length){sel={r:mv.r,c:mv.c};draw();return;}
  }
  if(checkWin())return;
  turn=turn===1?2:1;
  draw();
  if(turn===2)setTimeout(aiMove,400);
  else msg.textContent='Your turn (red)';
}

function checkWin(){
  let reds=0,blacks=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){if(isRed(board[r][c]))reds++;if(isBlack(board[r][c]))blacks++;}
  if(!reds){endGame('black');return true;}if(!blacks){endGame('red');return true;}
  // check no moves
  const hasMoves=Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>getMoves(r,c).length)).flat().some(v=>v>0);
  if(!hasMoves){endGame(turn===1?'black':'red');return true;}
  return false;
}

function aiMove(){
  if(state!=='playing')return;
  const moves=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(isBlack(board[r][c]))getMoves(r,c).forEach(m=>moves.push({fr:r,fc:c,mv:m}));
  if(!moves.length){endGame('red');return;}
  const jumps=moves.filter(m=>m.mv.jump);
  const pick=jumps.length?jumps:moves;
  const{fr,fc,mv}=pick[Math.floor(Math.random()*pick.length)];
  doMove(fr,fc,mv);
  if(turn===1)msg.textContent='Your turn (red)';
}

function draw(){
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    ctx.fillStyle=(r+c)%2===0?'#f0d9b5':'#b58863';ctx.fillRect(c*T,r*T,T,T);
    if(sel&&sel.r===r&&sel.c===c){ctx.fillStyle='rgba(255,255,0,0.35)';ctx.fillRect(c*T,r*T,T,T);}
    const p=board[r][c];
    if(p){
      const cx=c*T+T/2,cy=r*T+T/2;
      ctx.fillStyle=isRed(p)?'#cc2200':'#111';ctx.beginPath();ctx.arc(cx,cy,T*0.38,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=isRed(p)?'#ff6644':'#555';ctx.lineWidth=2;ctx.stroke();
      if(isKing(p)){ctx.fillStyle='#ffd700';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('♛',cx,cy+6);}
    }
  }
  // show valid moves
  if(sel){
    const moves=getMoves(sel.r,sel.c).filter(m=>!allJumps()||m.jump);
    moves.forEach(m=>{ctx.fillStyle='rgba(0,255,0,0.25)';ctx.fillRect(m.c*T,m.r*T,T,T);});
  }
  if(state==='idle'){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';ctx.fillText('CHECKERS',W/2,H/2-16);ctx.font='13px monospace';ctx.fillText('Click to start',W/2,H/2+14);ctx.textAlign='left';}
}

function endGame(winner){
  state='over';draw();
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=winner==='red'?'#e74c3c':'#333';ctx.font='bold 24px monospace';ctx.textAlign='center';
  ctx.fillText(winner==='red'?'You Win! 🎉':'AI Wins!',W/2,H/2-16);ctx.textAlign='left';
  msg.textContent=(winner==='red'?'You win!':'AI wins!')+' Press New Game.';
}

canvas.addEventListener('click',e=>{
  if(state==='idle'){init();return;}
  const r=canvas.getBoundingClientRect();
  const c=Math.floor((e.clientX-r.left)/T),row=Math.floor((e.clientY-r.top)/T);
  if(row>=0&&row<8&&c>=0&&c<8)click(row,c);
});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
