<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #fff; gap: 8px; }
canvas { border: 1px solid #333; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #222; color: #fff; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">↑ thrust · ← → rotate · Space shoot</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=480,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const TAU=Math.PI*2;
const SAVE_KEY='asteroids-best';
let state='idle',ship,asteroids,bullets,score,lives,best=0,raf,keys={},invincible=0;

function loadState(){const saved=localStorage.getItem(SAVE_KEY);if(saved){best=JSON.parse(saved).best||0;}}
function saveState(){localStorage.setItem(SAVE_KEY,JSON.stringify({best}));}

function mkAsteroid(x,y,size){
  const pts=[];for(let i=0;i<10;i++){const a=i/10*TAU,r=size*(0.7+Math.random()*0.5);pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r});}
  const angle=Math.random()*TAU,speed=(3-size/20)*0.5+0.5;
  return{x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,size,rot:0,rotSpeed:(Math.random()-0.5)*0.05,pts};
}

function spawnAsteroids(n){for(let i=0;i<n;i++){let x,y;do{x=Math.random()*W;y=Math.random()*H;}while(Math.hypot(x-W/2,y-H/2)<100);asteroids.push(mkAsteroid(x,y,40));}}

function init(){
  ship={x:W/2,y:H/2,vx:0,vy:0,angle:-Math.PI/2,alive:true};
  asteroids=[];bullets=[];score=0;lives=3;invincible=120;
  spawnAsteroids(4);
  state='playing';msg.textContent=`Score: 0  ❤️❤️❤️  Best: ${best}`;btn.textContent='Restart';
  cancelAnimationFrame(raf);loop();
}

function update(){
  if(keys['ArrowLeft'])ship.angle-=0.07;
  if(keys['ArrowRight'])ship.angle+=0.07;
  if(keys['ArrowUp']){ship.vx+=Math.cos(ship.angle)*0.25;ship.vy+=Math.sin(ship.angle)*0.25;}
  ship.vx*=0.98;ship.vy*=0.98;
  ship.x=(ship.x+ship.vx+W)%W;ship.y=(ship.y+ship.vy+H)%H;
  if(invincible>0)invincible--;

  // bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;});
  bullets=bullets.filter(b=>b.life>0);

  // asteroids
  asteroids.forEach(a=>{a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;a.rot+=a.rotSpeed;});

  // bullet-asteroid
  for(const b of bullets){
    for(const a of asteroids){
      if(Math.hypot(b.x-a.x,b.y-a.y)<a.size){
        b.life=0; score+=a.size>25?10:20;
        const kids=[];
        if(a.size>20){for(let i=0;i<2;i++)kids.push(mkAsteroid(a.x,a.y,a.size/2));}
        asteroids=asteroids.filter(x=>x!==a);asteroids.push(...kids);
        msg.textContent='Score: '+score+'  '+'❤️'.repeat(lives);break;
      }
    }
  }

  // ship-asteroid collision
  if(invincible<=0){
    for(const a of asteroids){
      if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.size+10){
        lives--;invincible=120;
        msg.textContent='Score: '+score+'  '+'❤️'.repeat(lives);
        if(!lives){endGame(false);return;}
        break;
      }
    }
  }
  if(!asteroids.length){spawnAsteroids(Math.min(8,4+Math.floor(score/100)));}
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#fff';for(let i=0;i<80;i++){ctx.fillRect((i*137)%W,(i*97)%H,1,1);}
  // asteroids
  for(const a of asteroids){
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
    ctx.strokeStyle='#aaa';ctx.lineWidth=2;ctx.beginPath();
    a.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath();ctx.stroke();ctx.restore();
  }
  // bullets
  ctx.fillStyle='#ff0';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,3,0,TAU);ctx.fill();});
  // ship
  if(invincible%10<6){
    ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle);
    ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(18,0);ctx.lineTo(-12,10);ctx.lineTo(-8,0);ctx.lineTo(-12,-10);ctx.closePath();ctx.stroke();
    if(keys['ArrowUp']){ctx.strokeStyle='#f80';ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-20,0);ctx.stroke();}
    ctx.restore();
  }
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 26px monospace';ctx.textAlign='center';
    ctx.fillText('ASTEROIDS',W/2,H/2-20);ctx.font='13px monospace';
    ctx.fillText('↑ thrust  ←→ rotate  Space shoot',W/2,H/2+14);ctx.textAlign='left';
  }
}

function endGame(won){
  if(score>best){best=score;saveState();}
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 26px monospace';ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-20);ctx.font='16px monospace';
  ctx.fillText('Score: '+score+' | Best: '+best,W/2,H/2+16);ctx.textAlign='left';
  msg.textContent='Game Over — Score: '+score+' | Best: '+best;
}

let shootCooldown=0;
function loop(){
  update();draw();
  if(keys['Space']&&shootCooldown<=0){
    bullets.push({x:ship.x+Math.cos(ship.angle)*20,y:ship.y+Math.sin(ship.angle)*20,vx:Math.cos(ship.angle)*10,vy:Math.sin(ship.angle)*10,life:50});
    shootCooldown=12;
  }
  if(shootCooldown>0)shootCooldown--;
  if(state==='playing')raf=requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(e.code==='Space'&&(state==='idle'||state==='over'))init();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
