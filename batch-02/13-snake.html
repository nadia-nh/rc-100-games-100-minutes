<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 10px; }
canvas { border: 2px solid #444; }
#ui { display: flex; gap: 16px; align-items: center; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 8px 18px; cursor: pointer; font: inherit; border-radius: 4px; }
a { color: #666; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<div id="ui">
  <span id="msg">Arrow keys · Press Start</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const W = 400, H = 400, CELL = 20, COLS = W/CELL, ROWS = H/CELL;
let state = 'idle', snake, dir, nextDir, apple, score, raf, best = 0;
const SPEED = 120;
const SAVE_KEY = 'snake-best';
function loadBest() { const b = localStorage.getItem(SAVE_KEY); if (b) best = parseInt(b); }
function saveBest() { if (score > best) { best = score; localStorage.setItem(SAVE_KEY, best); } }

function rnd(n) { return Math.floor(Math.random() * n); }
function newApple() {
  let pos;
  do { pos = { x: rnd(COLS), y: rnd(ROWS) }; }
  while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  apple = newApple();
  score = 0; state = 'playing';
  msg.textContent = 'Score: 0 (Best: ' + best + ')';
  btn.textContent = 'Restart';
  cancelAnimationFrame(raf);
  let last = 0;
  function step(ts) {
    if (state !== 'playing') return;
    raf = requestAnimationFrame(step);
    if (ts - last < SPEED) return;
    last = ts; dir = nextDir; tick();
  }
  raf = requestAnimationFrame(step);
}

function tick() {
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }
  snake.unshift(head);
  if (head.x === apple.x && head.y === apple.y) { score++; apple = newApple(); msg.textContent = 'Score: ' + score; }
  else snake.pop();
  draw();
}

function draw() {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  // grid dots
  ctx.fillStyle = '#1a1a1a';
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) { ctx.fillRect(x*CELL+9, y*CELL+9, 2, 2); }
  // apple
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(apple.x*CELL+2, apple.y*CELL+2, CELL-4, CELL-4);
  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
  if (state === 'idle') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 30px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SNAKE', W/2, H/2-16);
    ctx.fillStyle = '#eee'; ctx.font = '14px monospace';
    ctx.fillText('Arrow keys to move', W/2, H/2+16);
    ctx.textAlign = 'left';
  }
}

function endGame() {
  saveBest();
  state = 'over';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2-16);
  ctx.fillStyle = '#eee'; ctx.font = '16px monospace';
  ctx.fillText('Score: ' + score + ' (Best: ' + best + ')', W/2, H/2+16);
  ctx.textAlign = 'left';
  msg.textContent = 'Game Over — Score: ' + score + ' (Best: ' + best + ')';
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0} };
  if (map[e.key]) { e.preventDefault(); const d = map[e.key]; if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d; }
  if (e.code === 'Space' && (state === 'idle' || state === 'over')) init();
});
btn.addEventListener('click', init);
loadBest();
draw();
</script>
</body>
</html>
