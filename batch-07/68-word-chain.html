<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Chain</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f0e8; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #333; gap: 12px; }
#game { width: 420px; display: flex; flex-direction: column; gap: 10px; }
#chain { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; padding: 8px;
         background: #fff; border: 1px solid #ccc; border-radius: 6px; }
.word-chip { background: #4a8ac4; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.9rem; }
.word-chip.new { background: #2ecc71; }
#hint { color: #888; font-size: 0.85rem; min-height: 20px; }
#input-row { display: flex; gap: 8px; }
#word-input { flex: 1; padding: 8px; border: 2px solid #ccc; border-radius: 6px; font: inherit; font-size: 1rem; }
#word-input:focus { outline: none; border-color: #4a8ac4; }
#submit { background: #4a8ac4; color: #fff; border: none; padding: 8px 16px; cursor: pointer; font: inherit; border-radius: 6px; }
#submit:hover { background: #3a7ab4; }
#timer-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
#timer-fill { height: 100%; background: #2ecc71; transition: width 0.1s, background 0.3s; border-radius: 4px; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button.main { background: #888; color: #fff; border: none; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #aaa; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<div id="game">
  <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
  <div id="chain"></div>
  <div id="hint"></div>
  <div id="input-row">
    <input id="word-input" type="text" placeholder="Type a word..." autocomplete="off" spellcheck="false">
    <button id="submit">→</button>
  </div>
</div>
<div id="ui">
  <span id="msg">Type a word starting with the last letter!</span>
  <button class="main" id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
// Large word list for validation

weak weal wean weep weld well welt went were west what when whip whom wide wile will wilt wimp wind wine wing wink wipe wire wise
wish wisp with wive woke wolf womb wont word wore work worm worn wrap writ yawn year yell your zero zone zoom`.split(/\s+/).filter(w=>w.length>=3));

const TIME=15;
let chain,usedWords,current,timerEnd,raf,state='idle';

function init(){
  chain=[];usedWords=new Set();
  const starters=[...WORDS].filter(w=>w.length===4);
  current=starters[Math.floor(Math.random()*starters.length)];
  chain.push({word:current,isNew:false});usedWords.add(current);
  state='playing';timerEnd=Date.now()+TIME*1000;
  document.getElementById('btn').textContent='Restart';
  document.getElementById('word-input').value='';
  document.getElementById('word-input').focus();
  document.getElementById('hint').textContent=`Must start with: "${current.slice(-1).toUpperCase()}"`;
  renderChain();requestAnimationFrame(tickTimer);
}

function tickTimer(){
  if(state!=='playing')return;
  const left=Math.max(0,(timerEnd-Date.now())/1000);
  const pct=left/TIME*100;
  const fill=document.getElementById('timer-fill');
  fill.style.width=pct+'%';
  fill.style.background=pct>50?'#2ecc71':pct>25?'#f39c12':'#e74c3c';
  if(left<=0){endGame();return;}
  requestAnimationFrame(tickTimer);
}

function submit(){
  if(state!=='playing')return;
  const input=document.getElementById('word-input');
  const word=input.value.trim().toLowerCase();
  input.value='';
  if(word.length<3){setHint('Too short! Min 3 letters.');return;}
  if(!WORDS.has(word)){setHint(`"${word}" not in word list.`);return;}
  if(usedWords.has(word)){setHint(`"${word}" already used!`);return;}
  const needed=current.slice(-1);
  if(word[0]!==needed){setHint(`Must start with "${needed.toUpperCase()}"!`);return;}
  usedWords.add(word);chain.push({word,isNew:true});current=word;
  timerEnd=Date.now()+TIME*1000;
  setHint(`Must start with: "${current.slice(-1).toUpperCase()}"`);
  renderChain();
  document.getElementById('msg').textContent=`Chain: ${chain.length} words!`;
}

function setHint(t){document.getElementById('hint').textContent=t;}

function renderChain(){
  const div=document.getElementById('chain');div.innerHTML='';
  chain.slice(-8).forEach((w,i)=>{
    const d=document.createElement('div');d.className='word-chip'+(w.isNew&&i===chain.slice(-8).length-1?' new':'');
    d.textContent=w.word;div.appendChild(d);
  });
  div.scrollLeft=div.scrollWidth;
}

function endGame(){
  state='over';
  document.getElementById('timer-fill').style.width='0%';
  document.getElementById('msg').textContent=`Time's up! Chain of ${chain.length} words!`;
  setHint('Press Start to play again.');
}

document.getElementById('submit').addEventListener('click',submit);
document.getElementById('word-input').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
document.getElementById('btn').addEventListener('click',init);
</script>
</body>
</html>
