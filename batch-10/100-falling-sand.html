<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falling Sand</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #333; cursor: crosshair; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; flex-wrap: wrap; justify-content: center; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">1=Sand 2=Water 3=Wall. Fill the green goal with sand.</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=480,cols=120,rows=120,cell=4,msg=document.getElementById('msg'),btn=document.getElementById('btn');
let grid,selType=1,mouseDown=false,state='idle',raf,goalCount=0;
function makeGrid(){return Array(rows).fill(null).map(()=>Array(cols).fill(0));}
function init(){grid=makeGrid();state='playing';goalCount=0;btn.textContent='Restart';msg.textContent='Use mouse drag to place particles.';cancelAnimationFrame(raf);loop();}
function setCell(x,y,value){if(x<0||x>=cols||y<0||y>=rows)return; if(goalArea(x,y)&&value===1){goalCount++;} grid[y][x]=value;}
function goalArea(x,y){return x>cols-20 && y>rows-18;}
function update(){if(state!=='playing')return;
  goalCount=0;
  for(let y=rows-2;y>=0;y--)for(let x=0;x<cols;x++){
    const cellValue=grid[y][x];
    if(cellValue===2){
      if(grid[y+1][x]===0){grid[y+1][x]=2;grid[y][x]=0;} else if(grid[y][x-1]===0){grid[y][x-1]=2;grid[y][x]=0;} else if(grid[y][x+1]===0){grid[y][x+1]=2;grid[y][x]=0;}
    } else if(cellValue===1){
      if(grid[y+1][x]===0){grid[y+1][x]=1;grid[y][x]=0;} else if(grid[y+1][x]===2){grid[y][x]=0;grid[y+1][x]=1;grid[y][x]=2;} }
  }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ if(goalArea(x,y)&&grid[y][x]===1)goalCount++; }
  if(goalCount>200){endGame(true);}
}
function draw(){ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const v=grid[y][x];
    if(v===0) continue;
    if(v===1) ctx.fillStyle='#daa520';
    else if(v===2) ctx.fillStyle='#4aaaff';
    else ctx.fillStyle='#666';
    ctx.fillRect(x*cell,y*cell,cell,cell);
  }
  ctx.fillStyle='rgba(20,180,20,0.3)';ctx.fillRect((cols-20)*cell,(rows-18)*cell,20*cell,18*cell);
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(0,0,W,22);
  ctx.fillStyle='#000';ctx.font='12px monospace';ctx.textAlign='left';
  const mode = selType===1?'Sand':selType===2?'Water':'Wall';
  ctx.fillText(`Mode: ${mode} (1/2/3)  Goal: ${goalCount}/200`,4,15);
  if(state==='idle'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd700';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('FALLING SAND',W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.fillText('Draw particles to fill the goal',W/2,H/2+10);
  }}
function endGame(won){state='over';cancelAnimationFrame(raf);ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=won?'#0f0':'#f44';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText(won?'GOAL FILLED!':'Game Over',W/2,H/2-16);ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.fillText(`Sand in goal: ${goalCount}`,W/2,H/2+14);msg.textContent=won?'Nice flow!':'Keep drawing.';}
function loop(){if(state==='playing'){update();}draw();if(state==='playing')raf=requestAnimationFrame(loop);}
canvas.addEventListener('mousedown',e=>{if(state!=='playing')return; mouseDown=true; handleDraw(e);});
canvas.addEventListener('mousemove',e=>{if(mouseDown)handleDraw(e);});
canvas.addEventListener('mouseup',()=>mouseDown=false);
canvas.addEventListener('mouseleave',()=>mouseDown=false);
canvas.addEventListener('click',e=>{if(state!=='playing')return;handleDraw(e);});
function handleDraw(e){const rect=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-rect.left)/cell);const y=Math.floor((e.clientY-rect.top)/cell);if(x<0||x>=cols||y<0||y>=rows) return; if(selType===3){setCell(x,y,3);} else {setCell(x,y,selType);} }
window.addEventListener('keydown',e=>{if(e.key==='1')selType=1; if(e.key==='2')selType=2; if(e.key==='3')selType=3;});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
