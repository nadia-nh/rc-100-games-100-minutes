<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Match</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column;
       align-items: center; justify-content: center; font-family: system-ui; color: #eee; gap: 16px; }
h1 { font-size: 1.8rem; }
#info { display: flex; gap: 24px; font-size: 1rem; color: #aaa; }
#grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.card { width: 80px; height: 80px; border-radius: 10px; cursor: pointer; font-size: 2rem;
        display: flex; align-items: center; justify-content: center;
        background: #2a2a4e; border: 2px solid #3a3a6e; transition: transform 0.15s;
        user-select: none; }
.card.flipped { background: #e8e8f8; border-color: #aaa; transform: scale(1.05); }
.card.matched { background: #1a3a1a; border-color: #27ae60; cursor: default; }
#status { font-size: 1rem; min-height: 1.4em; color: #aaa; }
button { background: #9b59b6; color: #fff; border: none; padding: 10px 24px;
         border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<h1>🃏 Memory Match</h1>
<div id="info"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/8</span></div>
<div id="grid"></div>
<div id="status">Find all matching pairs!</div>
<button id="btn">New Game</button>
<a href="../index.html">↩ Gallery</a>
<script>
const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
const grid = document.getElementById('grid');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const statusEl = document.getElementById('status');
let cards = [], flipped = [], moves = 0, pairs = 0, locked = false;

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function newGame() {
  moves = 0; pairs = 0; flipped = []; locked = false;
  movesEl.textContent = 0; pairsEl.textContent = '0';
  statusEl.textContent = 'Find all matching pairs!';
  const deck = shuffle([...EMOJIS, ...EMOJIS]);
  grid.innerHTML = '';
  cards = deck.map((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.i = i;
    card.textContent = '';
    card.addEventListener('click', () => onFlip(card));
    grid.appendChild(card);
    return card;
  });
}

function onFlip(card) {
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  card.textContent = card.dataset.emoji;
  flipped.push(card);
  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    locked = true;
    setTimeout(check, 800);
  }
}

function check() {
  const [a, b] = flipped;
  if (a.dataset.emoji === b.dataset.emoji) {
    a.classList.add('matched'); b.classList.add('matched');
    pairs++;
    pairsEl.textContent = pairs;
    if (pairs === EMOJIS.length) statusEl.textContent = `🎉 You win in ${moves} moves!`;
  } else {
    a.classList.remove('flipped'); b.classList.remove('flipped');
    a.textContent = ''; b.textContent = '';
  }
  flipped = []; locked = false;
}

document.getElementById('btn').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
