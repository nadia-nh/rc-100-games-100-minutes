<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top-Down Shooter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #333; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">WASD/Arrows move · Mouse aim · Click shoot</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=480,msg=document.getElementById('msg'),btn=document.getElementById('btn');
let state='idle',player,enemies,bullets,score,wave,raf,keys={},mx=W/2,my=H/2,cooldown=0,spawnTimer=0;

canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
canvas.addEventListener('click',()=>{if(state==='idle'||state==='over')init();else shoot();});

function shoot(){
  if(cooldown>0)return;
  const dx=mx-player.x,dy=my-player.y,d=Math.hypot(dx,dy);
  bullets.push({x:player.x,y:player.y,vx:dx/d*12,vy:dy/d*12,r:4,life:60});
  cooldown=8;
}

function init(){
  player={x:W/2,y:H/2,r:16,hp:5,maxHp:5};
  enemies=[];bullets=[];score=0;wave=0;spawnTimer=0;
  state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=-20;}
  else if(side===1){x=W+20;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=H+20;}
  else{x=-20;y=Math.random()*H;}
  const hp=1+Math.floor(wave/5);
  enemies.push({x,y,r:14,hp,maxHp:hp,color:`hsl(${Math.random()*60},100%,50%)`});
}

function update(){
  const speed=4;
  if(keys['KeyW']||keys['ArrowUp'])player.y=Math.max(player.r,player.y-speed);
  if(keys['KeyS']||keys['ArrowDown'])player.y=Math.min(H-player.r,player.y+speed);
  if(keys['KeyA']||keys['ArrowLeft'])player.x=Math.max(player.r,player.x-speed);
  if(keys['KeyD']||keys['ArrowRight'])player.x=Math.min(W-player.r,player.x+speed);
  if(cooldown>0)cooldown--;

  // spawn
  spawnTimer++;wave=Math.floor(score/50);
  if(spawnTimer>Math.max(20,80-wave*5)){spawnTimer=0;spawnEnemy();if(wave>3)spawnEnemy();}

  // enemies move toward player
  enemies.forEach(e=>{
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
    const spd=1.2+wave*0.1;
    e.x+=dx/d*spd;e.y+=dy/d*spd;
    if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){
      player.hp--;e.x-=dx/d*20;e.y-=dy/d*20;
      if(player.hp<=0){endGame();return;}
    }
  });

  // bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;});
  bullets=bullets.filter(b=>b.life>0);

  // bullet hits enemy
  for(const b of bullets){
    for(const e of enemies){
      if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
        e.hp--;b.life=0;
        if(e.hp<=0){enemies=enemies.filter(x=>x!==e);score+=10+wave;}
        break;
      }
    }
  }
  msg.textContent=`Score: ${score}  HP: ${'█'.repeat(player.hp)}${'░'.repeat(player.maxHp-player.hp)}  Wave: ${wave+1}`;
}

function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40)ctx.strokeRect(x,0,40,H);
  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);
    ctx.fillStyle='#0f0';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.maxHp),4);
  });
  // bullets
  ctx.fillStyle='#ff0';
  bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
  // player
  ctx.fillStyle='#3af';
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7df';ctx.beginPath();ctx.arc(player.x,player.y,player.r-6,0,Math.PI*2);ctx.fill();
  // aim line
  const dx=mx-player.x,dy=my-player.y,d=Math.hypot(dx,dy);
  ctx.strokeStyle='rgba(255,255,0,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+dx/d*40,player.y+dy/d*40);ctx.stroke();
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('TOP-DOWN SHOOTER',W/2,H/2-20);ctx.font='13px monospace';
    ctx.fillText('WASD move · Click to shoot',W/2,H/2+14);ctx.textAlign='left';
  }
}

function endGame(){
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e74c3c';ctx.font='bold 26px monospace';ctx.textAlign='center';
  ctx.fillText('YOU DIED',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='16px monospace';
  ctx.fillText('Score: '+score,W/2,H/2+16);ctx.textAlign='left';
  msg.textContent='💀 Score: '+score;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{keys[e.code]=true;});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
