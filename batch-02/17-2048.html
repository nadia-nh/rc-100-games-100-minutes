<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #faf8ef; min-height: 100vh; display: flex; flex-direction: column;
       align-items: center; justify-content: center; font-family: system-ui; color: #776e65; gap: 16px; }
h1 { font-size: 2.5rem; font-weight: 900; color: #776e65; }
#info { display: flex; gap: 20px; }
.score-box { background: #bbada0; color: #fff; padding: 8px 18px; border-radius: 6px; text-align: center; }
.score-box span { display: block; font-size: 0.7rem; font-weight: 700; }
.score-box b { font-size: 1.3rem; }
#board { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px;
         background: #bbada0; padding: 10px; border-radius: 10px; }
.tile { width: 80px; height: 80px; border-radius: 6px; display: flex; align-items: center;
        justify-content: center; font-weight: 900; font-size: 1.5rem; }
#status { font-size: 1rem; min-height: 1.4em; color: #776e65; font-weight: 700; }
button { background: #8f7a66; color: #fff; border: none; padding: 10px 24px;
         border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
a { color: #aaa; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<h1>2048</h1>
<div id="info">
  <div class="score-box"><span>SCORE</span><b id="score">0</b></div>
  <div class="score-box"><span>BEST</span><b id="best">0</b></div>
</div>
<div id="board"></div>
<div id="status">Use arrow keys to slide</div>
<button id="btn">New Game</button>
<a href="../index.html">↩ Gallery</a>
<script>
const COLORS = {0:'#cdc1b4',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
const TC = {0:'#776e65',2:'#776e65',4:'#776e65',8:'#f9f6f2',16:'#f9f6f2',32:'#f9f6f2',64:'#f9f6f2',128:'#f9f6f2',256:'#f9f6f2',512:'#f9f6f2',1024:'#f9f6f2',2048:'#f9f6f2'};
let grid, score, best = 0;
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const SAVE_KEY = '2048-game-state';
function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify({grid,score})); }
function loadState() { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; }
function loadBest() { const b = localStorage.getItem('2048-best'); if (b) best = parseInt(b); bestEl.textContent = best; }
function saveBest() { if (score > best) { best = score; localStorage.setItem('2048-best', best); bestEl.textContent = best; } }

function newGame() {
  grid = Array(4).fill(null).map(() => Array(4).fill(0));
  score = 0; scoreEl.textContent = 0;
  statusEl.textContent = 'Use arrow keys to slide';
  addTile(); addTile(); render();
  saveState();
}

function addTile() {
  const empty = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) empty.push([r,c]);
  if (!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const v = grid[r][c];
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.background = COLORS[Math.min(v,2048)] || '#3c3a32';
    tile.style.color = TC[Math.min(v,2048)] || '#f9f6f2';
    tile.style.fontSize = v >= 1024 ? '1.1rem' : v >= 128 ? '1.3rem' : '1.5rem';
    tile.textContent = v || '';
    boardEl.appendChild(tile);
  }
  scoreEl.textContent = score;
  saveBest();
  saveState();
}

function slide(row) {
  const r = row.filter(x => x);
  let gained = 0;
  for (let i = 0; i < r.length - 1; i++) {
    if (r[i] === r[i+1]) { r[i] *= 2; gained += r[i]; r.splice(i+1,1); }
  }
  while (r.length < 4) r.push(0);
  score += gained;
  return r;
}

function move(dir) {
  const prev = JSON.stringify(grid);
  if (dir === 'left')  grid = grid.map(row => slide(row));
  if (dir === 'right') grid = grid.map(row => slide([...row].reverse()).reverse());
  if (dir === 'up')    grid = transpose(grid.map(row => slide(row.map((_,i)=>grid[i][row.indexOf(row[0])]))));
  if (dir === 'down')  { grid = transpose(grid); grid = grid.map(row => slide([...row].reverse()).reverse()); grid = transpose(grid); }
  if (JSON.stringify(grid) !== prev) { addTile(); render(); checkEnd(); }
}

function transpose(g) { return g[0].map((_,i) => g.map(r => r[i])); }

function move2(dir) {
  const prev = grid.map(r=>[...r]);
  let changed = false;
  const rotate = () => { grid = grid[0].map((_,i) => grid.map(r=>r[i]).reverse()); };
  if (dir==='right') rotate(); rotate(); rotate();
  if (dir==='down') { rotate(); rotate(); }
  if (dir==='up') rotate();
  // slide left
  grid = grid.map(row => {
    const f = row.filter(x=>x); const out = [];
    for (let i=0;i<f.length;i++) { if (f[i]===f[i+1]){out.push(f[i]*2);score+=f[i]*2;i++;}else out.push(f[i]); }
    while(out.length<4)out.push(0);
    return out;
  });
  if (dir==='up'){rotate();rotate();rotate();}
  if (dir==='down'){rotate();rotate();}
  if (dir==='right'){rotate();}
  for (let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]!==prev[r][c]) changed=true;
  if (changed){addTile();render();checkEnd();}
}

function checkEnd() {
  if (grid.some(r=>r.includes(2048))) { statusEl.textContent = '🎉 You reached 2048!'; return; }
  for (let r=0;r<4;r++) for(let c=0;c<4;c++) {
    if (!grid[r][c]) return;
    if (c<3&&grid[r][c]===grid[r][c+1]) return;
    if (r<3&&grid[r][c]===grid[r+1][c]) return;
  }
  statusEl.textContent = '💀 No moves left!';
}

document.addEventListener('keydown', e => {
  const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if (map[e.key]) { e.preventDefault(); move2(map[e.key]); }
});
document.getElementById('btn').addEventListener('click', newGame);
loadBest();
const saved = loadState();
if (saved) { grid = saved.grid; score = saved.score; scoreEl.textContent = score; saveBest(); render(); } else { newGame(); }
</script>
</body>
</html>
