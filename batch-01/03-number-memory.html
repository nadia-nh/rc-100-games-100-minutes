<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Memory</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1b2a; min-height: 100vh; display: flex; flex-direction: column;
       align-items: center; justify-content: center; font-family: system-ui; color: #eee; gap: 18px; }
h1 { font-size: 1.8rem; }
#display { font-size: 3.5rem; font-weight: 900; letter-spacing: 8px; color: #4fc3f7;
           min-height: 80px; display: flex; align-items: center; font-family: monospace; }
#input { font-size: 2rem; padding: 8px 18px; border-radius: 8px; border: 2px solid #4fc3f7;
         background: #1a2a3a; color: #eee; text-align: center; width: 260px;
         font-family: monospace; letter-spacing: 6px; outline: none; }
#status { font-size: 1.1rem; min-height: 1.5em; }
#level { color: #888; font-size: 0.9rem; }
button { background: #0277bd; color: #fff; border: none; padding: 10px 26px;
         border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; font-size: 1rem; }
button:hover { background: #0288d1; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<h1>🔢 Number Memory</h1>
<div id="level">Level 1 — 3 digits</div>
<div id="display">—</div>
<input id="input" type="text" inputmode="numeric" placeholder="Type number" maxlength="12" disabled />
<div id="status">Press Start to begin</div>
<button id="btn">Start</button>
<a href="../index.html">↩ Gallery</a>
<script>
const displayEl = document.getElementById('display');
const inputEl = document.getElementById('input');
const statusEl = document.getElementById('status');
const btnEl = document.getElementById('btn');
const levelEl = document.getElementById('level');
let level = 1, digits = 3, current = '', phase = 'idle';

function randomNum(len) {
  let s = '';
  for (let i = 0; i < len; i++) s += i === 0 ? (1 + Math.floor(Math.random() * 9)) : Math.floor(Math.random() * 10);
  return s;
}

function showNumber() {
  phase = 'show';
  current = randomNum(digits);
  displayEl.textContent = current;
  inputEl.value = '';
  inputEl.disabled = true;
  statusEl.textContent = 'Memorize!';
  btnEl.disabled = true;
  const showTime = Math.max(1000, digits * 600);
  setTimeout(() => {
    displayEl.textContent = '?';
    phase = 'input';
    inputEl.disabled = false;
    inputEl.focus();
    statusEl.textContent = 'Type the number!';
  }, showTime);
}

btnEl.addEventListener('click', () => {
  if (phase === 'idle' || phase === 'result') { level = 1; digits = 3; levelEl.textContent = `Level ${level} — ${digits} digits`; showNumber(); }
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && phase === 'input') {
    const ans = inputEl.value.trim();
    if (ans === current) {
      level++; digits++;
      levelEl.textContent = `Level ${level} — ${digits} digits`;
      statusEl.textContent = '✅ Correct! Next level…';
      inputEl.disabled = true;
      setTimeout(showNumber, 800);
    } else {
      phase = 'result';
      displayEl.textContent = current;
      statusEl.textContent = `❌ Wrong! The number was ${current}. Reached level ${level}.`;
      btnEl.textContent = 'Restart';
      btnEl.disabled = false;
    }
  }
});
</script>
</body>
</html>
