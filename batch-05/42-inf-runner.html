<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Runner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #333; cursor: pointer; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="280"></canvas>
<div id="ui">
  <span id="msg">Space or Click to jump!</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=280,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const GROUND=H-50,G=0.8,JUMP=-15;
let state='idle',runner,obstacles,score,speed,raf,bgX=0,cloudX=0;

function init(){
  runner={x:80,y:GROUND-40,w:28,h:40,vy:0,onGround:true,frame:0};
  obstacles=[];score=0;speed=5;
  state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function jump(){
  if(runner.onGround){runner.vy=JUMP;runner.onGround=false;}
  if(state==='idle'||state==='over')init();
}

function spawnObs(){
  const type=Math.random();
  if(type<0.6) obstacles.push({x:W,y:GROUND-30,w:20,h:30,type:'cactus'});
  else if(type<0.8) obstacles.push({x:W,y:GROUND-60,w:36,h:20,type:'cactus'});
  else obstacles.push({x:W,y:GROUND-80,w:30,h:30,type:'bird',vy:0,phase:0});
}

function update(){
  runner.vy+=G;runner.y+=runner.vy;
  if(runner.y+runner.h>=GROUND){runner.y=GROUND-runner.h;runner.vy=0;runner.onGround=true;}
  runner.frame+=0.2;

  score++;speed=5+score/500;
  bgX-=speed*0.3;cloudX-=speed*0.1;

  if(Math.random()<0.012)spawnObs();
  obstacles.forEach(o=>{
    o.x-=speed;
    if(o.type==='bird'){o.phase+=0.08;o.y=GROUND-80+Math.sin(o.phase)*20;}
  });
  obstacles=obstacles.filter(o=>o.x+o.w>0);

  // collision
  for(const o of obstacles){
    if(runner.x+runner.w-6>o.x&&runner.x+6<o.x+o.w&&runner.y+runner.h-4>o.y&&runner.y+4<o.y+o.h){endGame();return;}
  }
  msg.textContent='Score: '+score+(score>500?score>1000?' 🔥🔥':' 🔥':'');
}

function draw(){
  // sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a2a4a');sky.addColorStop(1,'#2a3a5a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.15)';
  [[cloudX%W+0,40,60],[cloudX%W+160,60,80],[cloudX%W+320,35,50]].forEach(([x,y,w])=>{
    ctx.beginPath();ctx.ellipse(x,y,w,20,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+20,y+5,w*0.7,15,0,0,Math.PI*2);ctx.fill();
  });
  // ground
  ctx.fillStyle='#3a5a2a';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4a7a3a';ctx.fillRect(0,GROUND,W,8);
  // moving ground lines
  for(let x=(bgX%60);x<W;x+=60){ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(x,GROUND+8,30,4);}
  // obstacles
  obstacles.forEach(o=>{
    if(o.type==='bird'){
      ctx.fillStyle='#a00';ctx.beginPath();ctx.ellipse(o.x+15,o.y+15,15,8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c00';const wy=Math.sin(runner.frame*3)*5;ctx.beginPath();ctx.moveTo(o.x,o.y+5+wy);ctx.lineTo(o.x+30,o.y+5+wy);ctx.lineTo(o.x+15,o.y+15);ctx.closePath();ctx.fill();
    } else {
      ctx.fillStyle='#2a8a2a';ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#3aa03a';ctx.fillRect(o.x+3,o.y,o.w-6,6);
    }
  });
  // runner
  const legOff=runner.onGround?Math.sin(runner.frame)*8:0;
  ctx.fillStyle='#3af';ctx.fillRect(runner.x,runner.y,runner.w,runner.h-10);// body
  ctx.fillStyle='#f80';ctx.fillRect(runner.x+4,runner.y-12,20,12);// head
  ctx.fillStyle='#f5d';ctx.fillRect(runner.x,runner.y+runner.h-10+legOff,10,10);ctx.fillRect(runner.x+18,runner.y+runner.h-10-legOff,10,10);
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';
    ctx.fillText('INFINITE RUNNER',W/2,H/2-16);ctx.font='13px monospace';ctx.fillText('Space or Click to jump',W/2,H/2+14);ctx.textAlign='left';
  }
}

function endGame(){
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e74c3c';ctx.font='bold 26px monospace';ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-16);ctx.fillStyle='#fff';ctx.font='16px monospace';
  ctx.fillText('Score: '+score,W/2,H/2+14);ctx.textAlign='left';
  msg.textContent='Score: '+score;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
canvas.addEventListener('click',jump);
btn.addEventListener('click',()=>{if(state==='idle'||state==='over')init();});
draw();
</script>
</body>
</html>
