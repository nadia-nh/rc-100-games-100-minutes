<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simon Says</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; min-height: 100vh; display: flex; flex-direction: column;
       align-items: center; justify-content: center; font-family: system-ui; color: #eee; gap: 20px; }
h1 { font-size: 1.8rem; }
#info { font-size: 1rem; color: #888; min-height: 1.4em; }
#pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 300px; height: 300px; }
.btn { border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.1s; opacity: 0.4; }
.btn.lit { opacity: 1; }
.btn:active { opacity: 0.8; }
#g { background: #27ae60; }
#r { background: #e74c3c; }
#b { background: #2980b9; }
#y { background: #f1c40f; }
#status { font-size: 1.1rem; min-height: 1.5em; font-weight: 700; }
button#start { background: #555; color: #eee; border: none; padding: 10px 28px;
               border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<h1>🔵 Simon Says</h1>
<div id="info">Round: <b id="round">—</b> &nbsp;|&nbsp; Best: <b id="best">0</b></div>
<div id="pad">
  <button class="btn" id="g" data-i="0"></button>
  <button class="btn" id="r" data-i="1"></button>
  <button class="btn" id="b" data-i="2"></button>
  <button class="btn" id="y" data-i="3"></button>
</div>
<div id="status">Press Start!</div>
<button id="start">Start</button>
<a href="../index.html">↩ Gallery</a>
<script>
const IDS = ['g','r','b','y'];
const btns = IDS.map(id => document.getElementById(id));
const statusEl = document.getElementById('status');
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const startBtn = document.getElementById('start');
let seq = [], playerIdx = 0, accepting = false, best = 0;

function lit(i, ms = 400) {
  return new Promise(res => {
    btns[i].classList.add('lit');
    setTimeout(() => { btns[i].classList.remove('lit'); setTimeout(res, 100); }, ms);
  });
}

async function playSeq() {
  accepting = false;
  statusEl.textContent = 'Watch…';
  for (const i of seq) { await lit(i, 400); await new Promise(r => setTimeout(r, 100)); }
  accepting = true;
  playerIdx = 0;
  statusEl.textContent = 'Your turn!';
}

btns.forEach((btn, i) => {
  btn.addEventListener('click', async () => {
    if (!accepting) return;
    await lit(i, 200);
    if (i !== seq[playerIdx]) {
      accepting = false;
      statusEl.textContent = `❌ Wrong! You reached round ${seq.length}`;
      if (seq.length > best) { best = seq.length; bestEl.textContent = best; }
      startBtn.textContent = 'Play Again';
      startBtn.style.display = '';
      return;
    }
    playerIdx++;
    if (playerIdx === seq.length) {
      accepting = false;
      seq.push(Math.floor(Math.random() * 4));
      roundEl.textContent = seq.length;
      statusEl.textContent = '✅ Correct!';
      setTimeout(playSeq, 800);
    }
  });
});

startBtn.addEventListener('click', () => {
  seq = [Math.floor(Math.random() * 4)];
  roundEl.textContent = 1;
  startBtn.style.display = 'none';
  playSeq();
});
</script>
</body>
</html>
