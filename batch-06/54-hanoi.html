<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower of Hanoi</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f0e8; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #333; gap: 12px; }
canvas { border: 2px solid #ccc; cursor: pointer; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #888; color: #fff; border: none; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
select { font: inherit; padding: 4px; border-radius: 3px; }
a { color: #aaa; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="300"></canvas>
<div id="ui">
  <span id="msg">Click a peg to pick/place · Move all discs to peg 3!</span>
  <select id="discs"><option>3</option><option>4</option><option selected>5</option><option>6</option></select>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=300,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const COLORS=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];
let pegs,selected,moves,n,state='idle',minMoves;

function init(){
  n=parseInt(document.getElementById('discs').value);
  minMoves=Math.pow(2,n)-1;
  pegs=[[],[],[]];
  for(let i=n;i>=1;i--)pegs[0].push(i);
  selected=null;moves=0;state='playing';btn.textContent='Restart';
  msg.textContent=`Moves: 0 / min ${minMoves}`;draw();
}

function pegX(i){return 80+i*160;}
const BASE_Y=H-40,DISC_H=22,MAX_W=120;

function discW(d){return 30+d*(MAX_W-30)/n;}

function clickPeg(pi){
  if(state!=='playing')return;
  if(selected===null){
    if(pegs[pi].length>0){selected=pi;draw();}
  } else {
    if(selected===pi){selected=null;draw();return;}
    const top=pegs[pi].length?pegs[pi][pegs[pi].length-1]:Infinity;
    const moving=pegs[selected][pegs[selected].length-1];
    if(moving<=top){
      pegs[pi].push(pegs[selected].pop());
      moves++;selected=null;
      if(pegs[2].length===n){state='over';
        msg.textContent=`Solved in ${moves} moves! Min: ${minMoves} 🎉`;}
      else msg.textContent=`Moves: ${moves} / min ${minMoves}`;
    } else {selected=pi;}
    draw();
  }
}

function draw(){
  ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,W,H);
  // base
  ctx.fillStyle='#8B4513';ctx.fillRect(20,BASE_Y,W-40,12);
  // pegs
  for(let i=0;i<3;i++){
    ctx.fillStyle='#5a3a1a';
    ctx.fillRect(pegX(i)-6,BASE_Y-160,12,160);
    // peg number
    ctx.fillStyle='#888';ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText(i+1,pegX(i),BASE_Y+28);
    // discs
    pegs[i].forEach((d,j)=>{
      const w=discW(d);
      const x=pegX(i)-w/2,y=BASE_Y-(j+1)*DISC_H;
      ctx.fillStyle=COLORS[d-1]||'#888';ctx.fillRect(x,y,w,DISC_H-2);
      ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x,y,w,6);
      ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(x,y+DISC_H-6,w,4);
    });
    // highlight selected peg
    if(selected===i){
      ctx.strokeStyle='#f90';ctx.lineWidth=3;ctx.strokeRect(pegX(i)-70,BASE_Y-170,140,H-BASE_Y+10);
    }
  }
  // floating disc indicator
  if(selected!==null){
    const d=pegs[selected][pegs[selected].length-1];
    const w=discW(d);
    ctx.fillStyle=COLORS[d-1]||'#888';
    ctx.globalAlpha=0.6;ctx.fillRect(pegX(selected)-w/2,BASE_Y-185,w,DISC_H-2);ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
  if(state==='idle'){
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#333';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('TOWER OF HANOI',W/2,H/2-16);ctx.font='13px monospace';
    ctx.fillText('Click pegs to move discs · No big on small!',W/2,H/2+14);ctx.textAlign='left';
  }
}

canvas.addEventListener('click',e=>{
  if(state==='idle'){init();return;}
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left;
  for(let i=0;i<3;i++)if(Math.abs(x-pegX(i))<70)clickPeg(i);
});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
