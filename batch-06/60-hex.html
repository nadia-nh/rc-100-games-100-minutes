<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hex Board Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 10px; }
canvas { cursor: pointer; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="440"></canvas>
<div id="ui">
  <span id="msg">Blue connects top↔bottom · Red connects left↔right</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=440,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const N=9,R=22,DX=R*Math.sqrt(3),DY=R*1.5;
let board,turn,hover,state='idle';

function hexCenter(r,c){
  return{x:60+c*DX+r*DX/2, y:40+r*DY};
}

function init(){
  board=Array(N).fill(null).map(()=>Array(N).fill(0));
  turn=1;hover=null;state='playing';btn.textContent='Restart';
  msg.textContent='Blue (you) · Connect top to bottom!';draw();
}

function hexPath(cx,cy){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/6+i*Math.PI/3;
    const px=cx+R*0.92*Math.cos(a),py=cy+R*0.92*Math.sin(a);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function cellAt(mx,my){
  let best=null,bestD=R*1.2;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const{x,y}=hexCenter(r,c);
    const d=Math.hypot(mx-x,my-y);
    if(d<bestD){bestD=d;best={r,c};}
  }
  return best;
}

function neighbors(r,c){
  return[[r-1,c],[r+1,c],[r,c-1],[r,c+1],[r-1,c+1],[r+1,c-1]]
    .filter(([nr,nc])=>nr>=0&&nr<N&&nc>=0&&nc<N);
}

function checkWin(player){
  const visited=Array(N).fill(null).map(()=>Array(N).fill(false));
  const queue=[];
  // player 1 (blue) connects row 0 to row N-1
  // player 2 (red) connects col 0 to col N-1
  if(player===1){for(let c=0;c<N;c++)if(board[0][c]===1){queue.push([0,c]);visited[0][c]=true;}}
  else{for(let r=0;r<N;r++)if(board[r][0]===2){queue.push([r,0]);visited[r][0]=true;}}
  while(queue.length){
    const[r,c]=queue.shift();
    if(player===1&&r===N-1)return true;
    if(player===2&&c===N-1)return true;
    for(const[nr,nc]of neighbors(r,c)){
      if(!visited[nr][nc]&&board[nr][nc]===player){visited[nr][nc]=true;queue.push([nr,nc]);}
    }
  }
  return false;
}

function aiMove(){
  // simple: pick empty cell that blocks player or advances own connection
  const empty=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!board[r][c])empty.push([r,c]);
  if(!empty.length)return;
  // score: prefer center and cells that extend chain
  let best=null,bestS=-Infinity;
  for(const[r,c]of empty){
    const dr=r-N/2,dc=c-N/2;
    let s=-(dr*dr+dc*dc)*0.1;
    // count red neighbors
    s+=neighbors(r,c).filter(([nr,nc])=>board[nr][nc]===2).length*3;
    // prefer middle columns
    s+=Math.min(c,N-1-c);
    if(s>bestS){bestS=s;best=[r,c];}
  }
  if(best){board[best[0]][best[1]]=2;if(checkWin(2)){endGame(2);return;}turn=1;}
  msg.textContent='Your turn (blue)';draw();
}

function click(r,c){
  if(state!=='playing'||turn!==1||board[r][c])return;
  board[r][c]=1;
  if(checkWin(1)){endGame(1);return;}
  turn=2;msg.textContent='AI thinking...';draw();
  setTimeout(aiMove,300);
}

function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  // border labels
  ctx.font='12px monospace';ctx.fillStyle='#3498db';ctx.textAlign='center';
  ctx.fillText('▼ BLUE ▼',W/2-20,18);ctx.fillText('▲ BLUE ▲',W/2+40,H-6);
  ctx.fillStyle='#e74c3c';ctx.textAlign='left';
  ctx.fillText('RED▶',4,H/2-10);ctx.textAlign='right';ctx.fillText('◀RED',W-4,H/2+10);
  ctx.textAlign='left';

  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const{x,y}=hexCenter(r,c);
    hexPath(x,y);
    const isHover=hover&&hover.r===r&&hover.c===c&&!board[r][c]&&turn===1&&state==='playing';
    ctx.fillStyle=board[r][c]===1?'#3498db':board[r][c]===2?'#e74c3c':isHover?'rgba(52,152,219,0.3)':'#2a2a4a';
    ctx.fill();
    ctx.strokeStyle='#4a4a7a';ctx.lineWidth=1.5;ctx.stroke();
  }

  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('HEX',W/2,H/2-20);ctx.font='13px monospace';
    ctx.fillText('Blue: connect top↔bottom',W/2,H/2+8);
    ctx.fillText('Red (AI): connect left↔right',W/2,H/2+28);ctx.textAlign='left';
  }
}

function endGame(winner){
  state='over';
  msg.textContent=winner===1?'You win! Blue connected! 🎉':'AI wins! Red connected!';
  draw();
}

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  hover=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(state==='playing')draw();
});
canvas.addEventListener('click',e=>{
  if(state==='idle'){init();return;}
  const r=canvas.getBoundingClientRect();
  const cell=cellAt(e.clientX-r.left,e.clientY-r.top);
  if(cell)click(cell.r,cell.c);
});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
