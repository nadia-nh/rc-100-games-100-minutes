<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reaction Time</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; min-height: 100vh; display: flex; flex-direction: column;
       align-items: center; justify-content: center; font-family: system-ui; color: #eee; gap: 20px; }
#box { width: 340px; height: 220px; border-radius: 16px; display: flex; align-items: center;
       justify-content: center; font-size: 1.4rem; font-weight: 700; cursor: pointer;
       background: #222; transition: background 0.1s; user-select: none; }
#box.wait { background: #c0392b; color: #fff; }
#box.go   { background: #27ae60; color: #fff; }
#scores { font-size: 0.9rem; color: #888; text-align: center; min-height: 60px; }
a { color: #666; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<h1>⚡ Reaction Time</h1>
<div id="box">Click to start</div>
<div id="scores">Best: —<br>Last: —</div>
<a href="../index.html">↩ Gallery</a>
<script>
const box = document.getElementById('box');
const scores = document.getElementById('scores');
let state = 'idle', t = null, startTime = 0, best = Infinity, attempts = [];

box.addEventListener('click', () => {
  if (state === 'idle' || state === 'result') {
    state = 'wait';
    box.className = 'wait';
    box.textContent = 'Wait for green…';
    const delay = 1000 + Math.random() * 3000;
    t = setTimeout(() => {
      state = 'go';
      box.className = 'go';
      box.textContent = 'CLICK NOW!';
      startTime = performance.now();
    }, delay);
  } else if (state === 'wait') {
    clearTimeout(t);
    state = 'result';
    box.className = '';
    box.textContent = 'Too early! Click to retry';
  } else if (state === 'go') {
    const ms = Math.round(performance.now() - startTime);
    attempts.push(ms);
    if (ms < best) best = ms;
    state = 'result';
    box.className = '';
    box.textContent = 'Click to go again';
    const avg = Math.round(attempts.reduce((a,b)=>a+b,0)/attempts.length);
    scores.innerHTML = `Best: ${best}ms &nbsp;|&nbsp; Last: ${ms}ms &nbsp;|&nbsp; Avg: ${avg}ms`;
  }
});
</script>
</body>
</html>
