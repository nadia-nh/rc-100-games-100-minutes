<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordle</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121213; min-height: 100vh; display: flex; flex-direction: column;
       align-items: center; justify-content: center; font-family: system-ui; color: #fff; gap: 14px; padding: 16px; }
h1 { font-size: 1.8rem; letter-spacing: 6px; }
#grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; }
.row { display: flex; gap: 5px; }
.tile { width: 58px; height: 58px; border: 2px solid #3a3a3c; display: flex; align-items: center;
        justify-content: center; font-size: 2rem; font-weight: 900; text-transform: uppercase; }
.tile.correct { background: #538d4e; border-color: #538d4e; }
.tile.present { background: #b59f3b; border-color: #b59f3b; }
.tile.absent  { background: #3a3a3c; border-color: #3a3a3c; }
.tile.active  { border-color: #999; }
.tile.pop     { animation: pop 0.1s ease; }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
#keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.kb-row { display: flex; gap: 5px; }
.kb-key { height: 56px; min-width: 40px; padding: 0 10px; border: none; border-radius: 4px;
          background: #818384; color: #fff; font: inherit; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
.kb-key.wide { min-width: 64px; }
.kb-key.correct { background: #538d4e; }
.kb-key.present { background: #b59f3b; }
.kb-key.absent  { background: #3a3a3c; }
#status { font-size: 1rem; min-height: 1.4em; font-weight: 700; color: #f1c40f; letter-spacing: 1px; }
button#newgame { background: #538d4e; color: #fff; border: none; padding: 10px 24px;
                 border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; display: none; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<h1>WORDLE</h1>
<div id="grid"></div>
<div id="status"></div>
<div id="keyboard"></div>
<button id="newgame">New Word</button>
<a href="../index.html">↩ Gallery</a>
<script>
const WORDS = ['ABOUT','ABOVE','ABUSE','ACTOR','ACUTE','ADMIT','ADOPT','ADULT','AFTER','AGAIN','AGENT','AGREE','AHEAD','ALARM','ALBUM','ALERT','ALIKE','ALIVE','ALLEY','ALLOW','ALONE','ALONG','ALTER','ANGEL','ANGER','ANGLE','ANGRY','ANIME','ANKLE','APPLE','APPLY','APRIL','ARENA','ARGUE','ARISE','ARMOR','AROSE','ARRAY','ARROW','ASIDE','ASKED','ATLAS','AUDIO','AUDIT','AVOID','AWAKE','AWARD','AWARE','AWFUL','BADLY','BAKER','BASES','BASIC','BASIS','BATCH','BEACH','BEGAN','BEGIN','BEING','BELOW','BENCH','BIBLE','BIKES','BIRTH','BLACK','BLADE','BLAME','BLAND','BLANK','BLAST','BLAZE','BLEED','BLEND','BLESS','BLIND','BLOCK','BLOOD','BLOOM','BLOWN','BLUES','BOARD','BONUS','BOOST','BOUND','BRAIN','BRAND','BRAVE','BREAD','BREAK','BREED','BRICK','BRIDE','BRIEF','BRING','BROAD','BROKE','BROOK','BROWN','BRUSH','BUILD','BUILT','BURST','BUYER','CABIN','CANDY','CARRY','CATCH','CAUSE','CHAIN','CHAIR','CHAOS','CHARM','CHART','CHASE','CHEAP','CHEAT','CHECK','CHEEK','CHESS','CHEST','CHIEF','CHILD','CHINA','CHOSE','CHUNK','CIVIL','CLAIM','CLASS','CLEAN','CLEAR','CLICK','CLIFF','CLIMB','CLOCK','CLONE','CLOSE','CLOTH','CLOUD','CLOWN','COACH','COAST','COMET','COMIC','COMMA','CORAL','COULD','COUNT','COURT','COVER','CRAFT','CRASH','CRAZY','CREAM','CREEK','CRIME','CROSS','CROWD','CROWN','CRUEL','CRUSH','CURVE','CYCLE'];
const KB = [['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','⌫']];
let secret, guesses, current, done, keyState;

function newGame() {
  secret = WORDS[Math.floor(Math.random()*WORDS.length)];
  guesses = []; current = ''; done = false; keyState = {};
  document.getElementById('newgame').style.display = 'none';
  document.getElementById('status').textContent = '';
  buildGrid(); buildKB();
}

function buildGrid() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div'); row.className = 'row'; row.id = 'row'+r;
    for (let c = 0; c < 5; c++) {
      const t = document.createElement('div'); t.className = 'tile'; t.id = `t${r}${c}`; row.appendChild(t);
    }
    g.appendChild(row);
  }
}

function buildKB() {
  const kb = document.getElementById('keyboard'); kb.innerHTML = '';
  KB.forEach(row => {
    const r = document.createElement('div'); r.className = 'kb-row';
    row.forEach(k => {
      const btn = document.createElement('button'); btn.className = 'kb-key' + (k.length>1?' wide':'');
      btn.textContent = k; btn.dataset.k = k;
      if (keyState[k]) btn.classList.add(keyState[k]);
      btn.addEventListener('click', () => onKey(k));
      r.appendChild(btn);
    });
    kb.appendChild(r);
  });
}

function onKey(k) {
  if (done) return;
  if (k === '⌫') { current = current.slice(0,-1); }
  else if (k === 'ENTER') { submit(); return; }
  else if (current.length < 5 && /^[A-Z]$/.test(k)) { current += k; }
  updateCurrentRow();
}

function updateCurrentRow() {
  const row = guesses.length;
  for (let c = 0; c < 5; c++) {
    const t = document.getElementById(`t${row}${c}`);
    t.textContent = current[c] || '';
    t.className = 'tile' + (current[c] ? ' active' : '');
  }
}

function submit() {
  if (current.length < 5) { shake(); return; }
  if (!WORDS.includes(current)) { document.getElementById('status').textContent = 'Not in word list!'; return; }
  const row = guesses.length;
  const result = grade(current, secret);
  result.forEach((cls, c) => {
    setTimeout(() => {
      const t = document.getElementById(`t${row}${c}`);
      t.className = 'tile ' + cls; t.textContent = current[c];
      const prev = keyState[current[c]];
      if (!prev || (prev==='absent'&&cls!=='absent') || (prev==='present'&&cls==='correct')) keyState[current[c]] = cls;
    }, c * 120);
  });
  guesses.push(current);
  setTimeout(() => {
    buildKB();
    if (current === secret) { document.getElementById('status').textContent = ['🎉 Genius!','🌟 Magnificent!','👏 Impressive!','✅ Splendid!','👍 Great!','😅 Phew!'][row]; done = true; document.getElementById('newgame').style.display = ''; }
    else if (guesses.length === 6) { document.getElementById('status').textContent = `The word was ${secret}`; done = true; document.getElementById('newgame').style.display = ''; }
    current = '';
  }, 700);
}

function grade(guess, target) {
  const res = Array(5).fill('absent'), pool = target.split('');
  // correct pass
  for (let i=0;i<5;i++) if(guess[i]===target[i]){res[i]='correct';pool[pool.indexOf(guess[i])]=null;}
  // present pass
  for (let i=0;i<5;i++) if(res[i]==='absent'){const j=pool.indexOf(guess[i]);if(j!==-1){res[i]='present';pool[j]=null;}}
  return res;
}

function shake() {
  const row = document.getElementById('row'+guesses.length);
  row.style.animation='none'; row.offsetHeight;
  row.style.animation='shake 0.4s';
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  if (e.key==='Enter') onKey('ENTER');
  else if (e.key==='Backspace') onKey('⌫');
  else if (/^[a-zA-Z]$/.test(e.key)) onKey(e.key.toUpperCase());
});

document.getElementById('newgame').addEventListener('click', newGame);

const style = document.createElement('style');
style.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}';
document.head.appendChild(style);
newGame();
</script>
</body>
</html>
