<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids Duel (2P)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #222; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #222; color: #eee; border: 1px solid #444; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #444; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="600" height="500"></canvas>
<div id="ui">
  <span id="msg">P1: WASD+F shoot · P2: Arrows+L shoot · Last alive wins!</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=600,H=500,msg=document.getElementById('msg'),btn=document.getElementById('btn');
let ships,bullets,asteroids,score,raf,keys={},state='idle';

function mkShip(x,y,angle,color,controls){
  return{x,y,vx:0,vy:0,angle,color,controls,alive:true,r:12,shootCool:0,invincible:60,kills:0};
}

function init(){
  ships=[
    mkShip(120,H/2,0,'#3af',{left:'KeyA',right:'KeyD',thrust:'KeyW',shoot:'KeyF'}),
    mkShip(W-120,H/2,Math.PI,'#f84',{left:'ArrowLeft',right:'ArrowRight',thrust:'ArrowUp',shoot:'KeyL'}),
  ];
  bullets=[];asteroids=[];score=[0,0];
  for(let i=0;i<5;i++)spawnAsteroid(null,3);
  state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function spawnAsteroid(near,size){
  let x,y;
  do{x=Math.random()*W;y=Math.random()*H;}
  while(near&&Math.hypot(x-near.x,y-near.y)<80);
  const ang=Math.random()*Math.PI*2;const spd=0.5+Math.random()*(4-size*0.8);
  asteroids.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:size*10,size,rot:0,rotV:(Math.random()-0.5)*0.04});
}

function wrap(obj){obj.x=(obj.x+W)%W;obj.y=(obj.y+H)%H;}

function update(){
  ships.forEach((s,si)=>{
    if(!s.alive)return;
    if(keys[s.controls.left])s.angle-=0.06;
    if(keys[s.controls.right])s.angle+=0.06;
    if(keys[s.controls.thrust]){s.vx+=Math.cos(s.angle)*0.25;s.vy+=Math.sin(s.angle)*0.25;}
    s.vx*=0.98;s.vy*=0.98;s.x+=s.vx;s.y+=s.vy;wrap(s);
    if(s.shootCool>0)s.shootCool--;
    if(keys[s.controls.shoot]&&s.shootCool===0){
      bullets.push({x:s.x+Math.cos(s.angle)*14,y:s.y+Math.sin(s.angle)*14,
        vx:Math.cos(s.angle)*8+s.vx,vy:Math.sin(s.angle)*8+s.vy,life:50,owner:si,color:s.color});
      s.shootCool=12;
    }
    if(s.invincible>0)s.invincible--;
  });

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
  bullets=bullets.filter(b=>b.life>0);

  asteroids.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.rot+=a.rotV;wrap(a);});

  // bullet-asteroid collisions
  const toAdd=[];
  bullets=bullets.filter(b=>{
    const hit=asteroids.findIndex(a=>Math.hypot(b.x-a.x,b.y-a.y)<a.r);
    if(hit>=0){
      const a=asteroids[hit];asteroids.splice(hit,1);
      if(a.size>1){toAdd.push({near:a,size:a.size-1});toAdd.push({near:a,size:a.size-1});}
      if(b.owner>=0)ships[b.owner].kills++;
      if(!asteroids.length&&!toAdd.length)for(let i=0;i<5;i++)spawnAsteroid(null,3);
      return false;
    }return true;
  });
  toAdd.forEach(({near,size})=>spawnAsteroid(near,size));

  // bullet-ship collisions
  bullets=bullets.filter(b=>{
    for(let si=0;si<ships.length;si++){
      const s=ships[si];
      if(!s.alive||b.owner===si||s.invincible>0)continue;
      if(Math.hypot(b.x-s.x,b.y-s.y)<s.r){s.alive=false;return false;}
    }return true;
  });

  // asteroid-ship collisions
  ships.forEach(s=>{
    if(!s.alive||s.invincible>0)return;
    for(const a of asteroids){
      if(Math.hypot(s.x-a.x,s.y-a.y)<s.r+a.r-4){s.alive=false;break;}
    }
  });

  const alive=ships.filter(s=>s.alive);
  if(alive.length<=1&&state==='playing'){
    state='over';
    const winner=ships[0].alive?0:ships[1].alive?1:-1;
    setTimeout(()=>{
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
      ctx.font='bold 24px monospace';ctx.textAlign='center';
      if(winner>=0){ctx.fillStyle=ships[winner].color;ctx.fillText(`P${winner+1} WINS!`,W/2,H/2-16);}
      else{ctx.fillStyle='#aaa';ctx.fillText('DRAW!',W/2,H/2-16);}
      ctx.fillStyle='#fff';ctx.font='13px monospace';
      ctx.fillText(`P1 kills: ${ships[0].kills}  P2 kills: ${ships[1].kills}`,W/2,H/2+14);
      ctx.textAlign='left';cancelAnimationFrame(raf);
    },100);
    msg.textContent=winner>=0?`P${winner+1} wins!`:'Draw!';
  }
}

function drawShip(s){
  if(!s.alive)return;
  if(s.invincible>0&&Math.floor(s.invincible/4)%2)return;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);
  ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(14,0);ctx.lineTo(-10,8);ctx.lineTo(-6,0);ctx.lineTo(-10,-8);ctx.closePath();ctx.stroke();
  if(keys[s.controls.thrust]){
    ctx.strokeStyle='rgba(255,150,0,0.8)';ctx.beginPath();
    ctx.moveTo(-6,0);ctx.lineTo(-14+(Math.random()*4),0);ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a){
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
  ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<8;i++){const ang=i/8*Math.PI*2,r=a.r*(0.8+Math.sin(i*2.3)*0.2);
    i===0?ctx.moveTo(Math.cos(ang)*r,Math.sin(ang)*r):ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);}
  ctx.closePath();ctx.stroke();ctx.restore();
}

function draw(){
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(0,0,W,H);
  asteroids.forEach(drawAsteroid);
  bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,2,0,Math.PI*2);ctx.fill();});
  ships.forEach(drawShip);
  // HUD
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,20);
  ctx.fillStyle=ships[0].color;ctx.font='12px monospace';ctx.fillText(`P1 kills:${ships[0].kills} ${ships[0].alive?'':'☠'}`,4,14);
  ctx.fillStyle=ships[1].color;ctx.textAlign='right';ctx.fillText(`${ships[1].alive?'':'☠'} kills:${ships[1].kills} P2`,W-4,14);ctx.textAlign='left';
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.textAlign='center';
    ctx.fillText('ASTEROIDS DUEL 2P',W/2,H/2-30);ctx.font='12px monospace';ctx.fillStyle='#3af';
    ctx.fillText('P1: WASD to move · F to shoot',W/2,H/2);ctx.fillStyle='#f84';
    ctx.fillText('P2: Arrows to move · L to shoot',W/2,H/2+22);ctx.textAlign='left';
  }
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&(state==='idle'||state==='over'))init();});
document.addEventListener('keyup',e=>keys[e.code]=false);
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
