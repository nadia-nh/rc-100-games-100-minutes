<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Invaders</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #0f0; gap: 8px; }
canvas { border: 1px solid #0f0; }
#ui { display: flex; gap: 16px; align-items: center; font-size: 0.9rem; }
button { background: #0a0; color: #fff; border: 1px solid #0f0; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #060; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">← → move · Space shoot · Press Start</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=480;
const msg=document.getElementById('msg'),btn=document.getElementById('btn');
const SAVE_KEY='space-invaders-best';
let state='idle',player,aliens,bullets,aBullets,score,lives,best=0,raf,keys={},alienDir,alienSpeed,alienTimer;

function loadState(){const saved=localStorage.getItem(SAVE_KEY);if(saved){best=JSON.parse(saved).best||0;}}
function saveState(){localStorage.setItem(SAVE_KEY,JSON.stringify({best}));}

function init(){
  player={x:W/2,y:H-40,w:36,h:16,cooldown:0};
  aliens=[]; alienDir=1; alienSpeed=1; alienTimer=0;
  for(let r=0;r<4;r++) for(let c=0;c<9;c++)
    aliens.push({x:40+c*44,y:40+r*36,w:28,h:20,alive:true,row:r});
  bullets=[]; aBullets=[]; score=0; lives=3;
  state='playing'; msg.textContent=`Score: 0  ❤️❤️❤️  Best: ${best}`; btn.textContent='Restart';
  cancelAnimationFrame(raf); loop();
}

function update(){
  if(keys['ArrowLeft'])player.x=Math.max(0,player.x-5);
  if(keys['ArrowRight'])player.x=Math.min(W-player.w,player.x+5);
  if(keys['Space']&&player.cooldown<=0){bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:12});player.cooldown=15;}
  if(player.cooldown>0)player.cooldown--;

  // move aliens
  alienTimer++;
  const alive=aliens.filter(a=>a.alive);
  if(!alive.length){endGame(true);return;}
  const speed=alienSpeed+Math.max(0,(36-alive.length)*0.08);
  if(alienTimer>=Math.max(4,30-score/50)){
    alienTimer=0;
    let hitWall=false;
    for(const a of alive){a.x+=alienDir*speed*4; if(a.x<0||a.x+a.w>W)hitWall=true;}
    if(hitWall){alienDir*=-1;for(const a of alive)a.y+=20;}
  }

  // alien shoots
  if(Math.random()<0.008*alive.length/36){
    const shooter=alive[Math.floor(Math.random()*alive.length)];
    aBullets.push({x:shooter.x+shooter.w/2-2,y:shooter.y+shooter.h,w:4,h:10});
  }

  // move bullets
  bullets.forEach(b=>b.y-=9);
  aBullets.forEach(b=>b.y+=5);
  bullets=bullets.filter(b=>b.y>-20);
  aBullets=aBullets.filter(b=>b.y<H+20);

  // bullet-alien collision
  for(const b of bullets){
    for(const a of alive){
      if(b.x<a.x+a.w&&b.x+b.w>a.x&&b.y<a.y+a.h&&b.y+b.h>a.y){a.alive=false;b.y=-999;score+=10*(4-a.row);break;}
    }
  }

  // alien bullet hits player
  for(const b of aBullets){
    if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){
      lives--;b.y=9999;
      const hearts=['','❤️','❤️❤️','❤️❤️❤️'][lives]||'';
      msg.textContent=`Score: ${score}  ${hearts}`;
      if(!lives){endGame(false);return;}
    }
  }
  // aliens reach bottom
  if(alive.some(a=>a.y+a.h>=player.y)){endGame(false);}
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // player
  ctx.fillStyle='#0f0';
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillRect(player.x+player.w/2-4,player.y-8,8,10);
  // aliens
  for(const a of aliens){
    if(!a.alive)continue;
    const colors=['#f00','#f80','#ff0','#0ff'];
    ctx.fillStyle=colors[a.row%4];
    ctx.fillRect(a.x,a.y,a.w,a.h);
    // alien shape
    ctx.fillStyle='#000';
    ctx.fillRect(a.x+4,a.y+4,6,6);ctx.fillRect(a.x+a.w-10,a.y+4,6,6);
    ctx.fillRect(a.x+2,a.y+a.h-6,a.w-4,4);
  }
  // bullets
  ctx.fillStyle='#0f0';bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  ctx.fillStyle='#f44';aBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0f0';ctx.font='bold 28px monospace';ctx.textAlign='center';
    ctx.fillText('SPACE INVADERS',W/2,H/2-20);ctx.font='14px monospace';
    ctx.fillText('← → move  Space shoot',W/2,H/2+16);ctx.textAlign='left';
  }
}

function endGame(won){
  if(score>best){best=score;saveState();}
  state='over';
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=won?'#0f0':'#f00';ctx.font='bold 26px monospace';ctx.textAlign='center';
  ctx.fillText(won?'EARTH SAVED!':'INVADED!',W/2,H/2-20);
  ctx.fillStyle='#fff';ctx.font='16px monospace';ctx.fillText('Score: '+score+' | Best: '+best,W/2,H/2+16);ctx.textAlign='left';
  msg.textContent=(won?'🎉':'💀')+' Score: '+score+' | Best: '+best;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(state==='idle'||state==='over')init();}});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
btn.addEventListener('click',init);
loadState();
draw();
</script>
</body>
</html>
