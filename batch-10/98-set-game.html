<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set Card Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f0e8; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; color: #1a1a2e; padding: 20px; }
h1 { margin-bottom: 14px; }
#status { font-size: 1rem; font-weight: 600; margin-bottom: 16px; min-height: 1.5em; color: #444; }
#board { width: min(600px,100%); display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.card { padding: 18px; border: 2px solid #ccc; border-radius: 12px; background: #fff; text-align: center; cursor: pointer; transition: border-color 0.2s, transform 0.2s; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
.card:hover { transform: translateY(-2px); border-color: #e07b54; }
.card.selected { border-color: #e07b54; background: #ffe8d5; }
.attribute { margin: 4px 0; font-size: 0.95rem; }
#controls { margin-top: 16px; display: flex; gap: 10px; }
button { background: #e07b54; color: #fff; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 700; }
button:hover { background: #c5613c; }
a { color: #888; font-size: 0.85rem; text-decoration: none; margin-top: 12px; }
a:hover { color: #555; }
</style>
</head>
<body>
<h1>Set Card Game</h1>
<div id="status">Press Start to play.</div>
<div id="board"></div>
<div id="controls"><button id="btn">Start</button></div>
<a href="../index.html">↩ Gallery</a>
<script>
const statusEl=document.getElementById('status');
const boardEl=document.getElementById('board');
const btn=document.getElementById('btn');
const counts=[1,2,3];
const colors=['Red','Green','Purple'];
const shapes=['Diamond','Circle','Squiggle'];
const fills=['Solid','Striped','Open'];
let deck=[],cards=[],selected=[],setsFound=0,state='idle';
function createDeck(){const deck=[];for(const count of counts)for(const color of colors)for(const shape of shapes)for(const fill of fills)deck.push({count,color,shape,fill});return deck.sort(()=>Math.random()-0.5);}
function init(){deck=createDeck();cards=deck.splice(0,9);selected=[];setsFound=0;state='playing';statusEl.textContent='Find 3 sets. Click 3 cards to claim.';render();btn.textContent='Restart';}
function render(){boardEl.innerHTML='';cards.forEach((card,index)=>{const el=document.createElement('div');el.className='card'+(selected.includes(index)?' selected':'');el.onclick=()=>toggleSelect(index);
  el.innerHTML=`<div class="attribute">${card.count} x ${card.shape}</div><div class="attribute">${card.color}</div><div class="attribute">${card.fill}</div>`;
  boardEl.appendChild(el);
});}
function toggleSelect(index){if(state!=='playing')return; if(selected.includes(index)){selected=selected.filter(i=>i!==index);} else {selected.push(index);} if(selected.length===3){checkSet();}}
function checkSet(){const [a,b,c]=selected.map(i=>cards[i]); if(isSet(a,b,c)){statusEl.textContent='Valid set!';setsFound++; removeSet();} else {statusEl.textContent='Not a set. Try again.';} selected=[]; render(); if(setsFound>=3){endGame(true);} }
function sameOrAllDifferent(a,b,c){return (a===b&&b===c)||(a!==b&&a!==c&&b!==c); }
function isSet(a,b,c){return ['count','color','shape','fill'].every(prop=>sameOrAllDifferent(a[prop],b[prop],c[prop]));}
function removeSet(){selected.sort((a,b)=>b-a).forEach(i=>cards.splice(i,1)); if(deck.length>0){cards.push(...deck.splice(0,3));} if(cards.length<9 && deck.length===0){state='over';statusEl.textContent='No more cards.';}}
function endGame(won){state='over';btn.textContent='Play Again'; if(won){statusEl.textContent=`Winner! You found ${setsFound} sets.`; } else {statusEl.textContent=`Game over. Sets found: ${setsFound}.`;}}
btn.addEventListener('click',init);
init();
</script>
</body>
</html>
