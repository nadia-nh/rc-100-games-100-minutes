* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f1a; color: #eee; font-family: system-ui, sans-serif; padding: 24px; }
h1 { text-align: center; font-size: 2.2rem; margin-bottom: 4px; color: #fff; }

.batch { margin-bottom: 36px; }

               letter-spacing: 2px; margin-bottom: 14px; border-bottom: 1px solid #222;
               padding-bottom: 6px; }
.grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px;
        padding: 14px 12px; display: flex; flex-direction: column; gap: 6px;
        transition: border-color 0.15s, background 0.15s; min-height: 180px; width: 160px; }
.card:hover { border-color: #5566cc; background: #1e1e38; }
.card.locked { opacity: 0.35; pointer-events: none; }
.card-preview { width: 100%; height: 60px; border-radius: 4px; margin-bottom: 6px; }
.card-num { font-size: 0.7rem; color: #555; font-weight: 700; font-family: monospace; }
.card-name { font-size: 0.95rem; font-weight: 700; color: #e8e8f0; line-height: 1.2; }
.card-genre { font-size: 0.7rem; padding: 2px 7px; border-radius: 99px; font-weight: 700;
              width: fit-content; margin-top: 2px; }
.card a { margin-top: 8px; background: #4455bb; color: #fff; text-decoration: none;
          padding: 6px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: 700;
          text-align: center; }
.card a:hover { background: #5566cc; }

// Detect which files exist by trying to fetch them (or just check checkpoint)
// For simplicity, we show all cards and let the browser handle 404s on click
const COMPLETED_BATCH = (() => {
  try {
    return parseInt(localStorage.getItem('completedBatch') || '10');
  } catch { return 10; }
})();

const gallery = document.getElementById('gallery');
const batches = {};
GAME_MANIFEST.forEach(g => { (batches[g.batch] = batches[g.batch] || []).push(g); });

const BATCH_NAMES = {
  1:'Batch 1 — Clickers, Counters, Reflexes',
  2:'Batch 2 — Simple Canvas & Easy Puzzles',
  3:'Batch 3 — Word, Card & Logic',
  4:'Batch 4 — Arcade & Shooters',
  5:'Batch 5 — Platformers & Physics',
  6:'Batch 6 — Puzzle & Strategy Board',
  7:'Batch 7 — Idle, Upgrades & Word',
  8:'Batch 8 — Variety Pack',
  9:'Batch 9 — Experimental & Creative',
  10:'Batch 10 — Hardest / Showcase',
};

Object.keys(batches).sort((a,b)=>a-b).forEach(b => {
  const section = document.createElement('div');
  section.className = 'batch';
  const title = document.createElement('div');
  title.className = 'batch-title';
  title.textContent = BATCH_NAMES[b];
  section.appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'grid';
  batches[b].forEach(g => {
    const card = document.createElement('div');
    card.className = 'card' + (g.batch > COMPLETED_BATCH ? ' locked' : '');
    card.innerHTML = `
      <div class="card-preview" style="background: ${GENRE_COLOR[g.genre]};"></div>
      <div class="card-num">#${String(g.num).padStart(3,'0')}</div>
      <div class="card-name">${g.name}</div>
      <span class="card-genre ${GENRE_CLASS[g.genre]||''}">${g.genre}</span>
      ${g.batch <= COMPLETED_BATCH ? `<a href="${g.file}">▶ Play</a>` : '<span style="color:#444;font-size:0.8rem;margin-top:8px">🔒 Coming soon</span>'}
    `;
    grid.appendChild(card);
  });
  section.appendChild(grid);
  gallery.appendChild(section);
});
