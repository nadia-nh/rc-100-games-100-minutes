<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bomberman Lite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #333; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #555; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="390" height="430"></canvas>
<div id="ui">
  <span id="msg">Arrow keys move · Space place bomb · Clear all enemies!</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=390,H=430,msg=document.getElementById('msg'),btn=document.getElementById('btn');
const T=30,COLS=13,ROWS=13;
// 0=empty,1=hard wall,2=soft wall,3=bomb,4=flame
let grid,player,enemies,bombs,flames,score,raf,keys={},state='idle',bombTimer;

function initGrid(){
  const g=Array(ROWS).fill(null).map(()=>Array(COLS).fill(0));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(r===0||r===ROWS-1||c===0||c===COLS-1)g[r][c]=1;
    else if(r%2===0&&c%2===0)g[r][c]=1;
    else if(!(r<=2&&c<=2)&&Math.random()<0.4)g[r][c]=2;
  }
  return g;
}

function init(){
  grid=initGrid();
  player={r:1,c:1,moveTimer:0};
  enemies=[{r:1,c:COLS-2,dr:0,dc:1,moveTimer:0},{r:ROWS-2,c:1,dr:1,dc:0,moveTimer:0},{r:ROWS-2,c:COLS-2,dr:0,dc:-1,moveTimer:0}];
  bombs=[];flames=[];score=0;
  state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function canWalk(r,c){return r>0&&r<ROWS-1&&c>0&&c<COLS-1&&grid[r][c]===0&&!bombs.some(b=>b.r===r&&b.c===c);}

function placeBomb(){
  const{r,c}=player;
  if(bombs.some(b=>b.r===r&&b.c===c))return;
  bombs.push({r,c,timer:120});grid[r][c]=3;
}

function explode(bomb){
  grid[bomb.r][bomb.c]=0;
  const dirs=[[0,0],[0,1],[0,-1],[1,0],[-1,0]];
  dirs.forEach(([dr,dc])=>{
    for(let i=0;i<=2;i++){
      const nr=bomb.r+dr*i,nc=bomb.c+dc*i;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS||grid[nr][nc]===1)break;
      flames.push({r:nr,c:nc,life:40});
      if(grid[nr][nc]===2){grid[nr][nc]=0;score+=10;break;}
    }
  });
}

function update(){
  if(state!=='playing')return;
  // player movement
  player.moveTimer++;
  if(player.moveTimer>=6){
    player.moveTimer=0;
    const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
    for(const[k,[dr,dc]]of Object.entries(dirs)){
      if(keys[k]){const nr=player.r+dr,nc=player.c+dc;if(canWalk(nr,nc)){player.r=nr;player.c=nc;}break;}
    }
  }
  if(keys['Space']&&!keys['_spaceUsed']){keys['_spaceUsed']=true;placeBomb();}
  if(!keys['Space'])keys['_spaceUsed']=false;

  // bombs countdown
  bombs.forEach(b=>{b.timer--;if(b.timer<=0)explode(b);});
  bombs=bombs.filter(b=>b.timer>0);

  // flames
  flames.forEach(f=>f.life--);flames=flames.filter(f=>f.life>0);

  // check player in flame
  if(flames.some(f=>f.r===player.r&&f.c===player.c)){endGame(false);return;}

  // enemy movement
  enemies.forEach(e=>{
    e.moveTimer++;
    if(e.moveTimer>=20){e.moveTimer=0;
      const opts=[[e.dr,e.dc],[-e.dc,e.dr],[e.dc,-e.dr],[-e.dr,-e.dc]].filter(([dr,dc])=>canWalk(e.r+dr,e.c+dc));
      if(opts.length){[e.dr,e.dc]=opts[Math.floor(Math.random()*opts.length)];e.r+=e.dr;e.c+=e.dc;}
      else{[e.dr,e.dc]=[e.dc,-e.dr];}
    }
    if(flames.some(f=>f.r===e.r&&f.c===e.c)){e.dead=true;score+=100;}
    if(e.r===player.r&&e.c===player.c){endGame(false);return;}
  });
  enemies=enemies.filter(e=>!e.dead);
  if(!enemies.length){endGame(true);return;}
  msg.textContent=`Score: ${score}  Enemies: ${enemies.length}`;
}

function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*T,y=r*T+20;
    if(grid[r][c]===1){ctx.fillStyle='#555';ctx.fillRect(x,y,T,T);ctx.fillStyle='#666';ctx.fillRect(x+1,y+1,T-2,6);}
    else if(grid[r][c]===2){ctx.fillStyle='#8B4513';ctx.fillRect(x+2,y+2,T-4,T-4);}
    else{ctx.fillStyle='#1a3a1a';ctx.fillRect(x,y,T,T);}
    if(grid[r][c]===3){ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('💣',x+T/2,y+T-4);}
  }
  flames.forEach(f=>{
    ctx.fillStyle=`rgba(255,${Math.floor(f.life*4)},0,0.8)`;
    ctx.fillRect(f.c*T+2,f.r*T+22,T-4,T-4);
  });
  // player
  ctx.font='22px serif';ctx.textAlign='center';
  ctx.fillText('😀',player.c*T+T/2,player.r*T+T/2+20+6);
  enemies.forEach(e=>ctx.fillText('👾',e.c*T+T/2,e.r*T+T/2+20+6));
  ctx.textAlign='left';
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,20);
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.fillText(`Score: ${score}  Enemies: ${enemies.length}  Space=bomb`,4,14);
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('BOMBERMAN',W/2,H/2-16);ctx.font='13px monospace';
    ctx.fillText('Arrows move · Space = bomb',W/2,H/2+14);ctx.textAlign='left';
  }
}

function endGame(won){
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=won?'#2ecc71':'#e74c3c';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText(won?'YOU WIN! 🎉':'BOOM! 💥',W/2,H/2-16);ctx.fillStyle='#fff';ctx.font='14px monospace';
  ctx.fillText('Score: '+score,W/2,H/2+14);ctx.textAlign='left';
  msg.textContent=(won?'Cleared! ':'💥 ')+'Score: '+score;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(state==='idle'||state==='over')init();
});
document.addEventListener('keyup',e=>keys[e.code]=false);
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
