<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pacifist Dodge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center;
       justify-content: center; min-height: 100vh; font-family: monospace; color: #eee; gap: 8px; }
canvas { border: 2px solid #222; }
#ui { display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
button { background: #222; color: #eee; border: 1px solid #444; padding: 6px 14px; cursor: pointer; font: inherit; border-radius: 3px; }
a { color: #444; font-size: 0.8rem; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<div id="ui">
  <span id="msg">Move mouse to dodge · Don't touch anything!</span>
  <button id="btn">Start</button>
  <a href="../index.html">↩</a>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=480,H=480,msg=document.getElementById('msg'),btn=document.getElementById('btn');
let player,bullets,enemies,score,raf,state='idle',mouse={x:W/2,y:H/2};

function init(){
  player={x:W/2,y:H/2,r:8};
  bullets=[];enemies=[];score=0;
  state='playing';btn.textContent='Restart';cancelAnimationFrame(raf);loop();
}

function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=-20;}
  else if(side===1){x=W+20;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=H+20;}
  else{x=-20;y=Math.random()*H;}
  const ang=Math.atan2(H/2-y,W/2-x);
  const spd=1+Math.random()*1.5;
  enemies.push({x,y,r:10+Math.random()*8,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,hue:Math.floor(Math.random()*360)});
}

function spawnBullet(){
  const ang=Math.random()*Math.PI*2;
  const spd=3+Math.random()*3;
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*W;y=0;}
  else if(side===1){x=W;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=H;}
  else{x=0;y=Math.random()*H;}
  const a=Math.atan2(player.y-y,player.x-x)+(Math.random()-0.5)*0.5;
  bullets.push({x,y,r:4,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd});
}

function update(){
  score++;
  // smooth move toward mouse
  player.x+=(mouse.x-player.x)*0.12;
  player.y+=(mouse.y-player.y)*0.12;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  if(Math.random()<0.015+score/20000)spawnEnemy();
  if(Math.random()<0.02+score/15000)spawnBullet();

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  enemies.forEach(e=>{e.x+=e.vx;e.y+=e.vy;
    // slightly home on player
    const a=Math.atan2(player.y-e.y,player.x-e.x);e.vx+=Math.cos(a)*0.02;e.vy+=Math.sin(a)*0.02;
    const spd=Math.sqrt(e.vx**2+e.vy**2);if(spd>2.5){e.vx*=2.5/spd;e.vy*=2.5/spd;}
  });

  bullets=bullets.filter(b=>b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10);
  enemies=enemies.filter(e=>e.x>-50&&e.x<W+50&&e.y>-50&&e.y<H+50);

  // collisions
  for(const b of bullets){if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r){endGame();return;}}
  for(const e of enemies){if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){endGame();return;}}

  msg.textContent=`Survived: ${score} frames (${(score/60).toFixed(1)}s)`;
}

function draw(){
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(0,0,W,H);
  // bullets
  bullets.forEach(b=>{ctx.fillStyle='#ff4';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,0,0.3)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.5,0,Math.PI*2);ctx.fill();});
  // enemies
  enemies.forEach(e=>{ctx.fillStyle=`hsl(${e.hue},80%,55%)`;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`hsla(${e.hue},80%,80%,0.2)`;ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.6,0,Math.PI*2);ctx.fill();});
  // player
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(player.x,player.y,player.r*2,0,Math.PI*2);ctx.fill();
  // HUD
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,20);
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.fillText(`Survived: ${(score/60).toFixed(1)}s · Move mouse to dodge!`,4,14);
  if(state==='idle'){
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('PACIFIST DODGE',W/2,H/2-20);ctx.font='13px monospace';ctx.fillStyle='#aaa';
    ctx.fillText('Move mouse · Touch nothing · Survive!',W/2,H/2+10);ctx.textAlign='left';
  }
}

function endGame(){
  state='over';cancelAnimationFrame(raf);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e74c3c';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText('HIT!',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='14px monospace';
  ctx.fillText(`Survived: ${(score/60).toFixed(1)} seconds`,W/2,H/2+10);ctx.textAlign='left';
  msg.textContent=`Survived ${(score/60).toFixed(1)}s! Click to retry.`;
}

function loop(){update();draw();if(state==='playing')raf=requestAnimationFrame(loop);}
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
canvas.addEventListener('click',()=>{if(state==='idle'||state==='over')init();});
btn.addEventListener('click',init);draw();
</script>
</body>
</html>
